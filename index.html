function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>reject(new Error('圖片轉換失敗'));r.readAsDataURL(blob)})}
function openImageCropper(file){
 return new Promise((resolve,reject)=>{
  if(!file||!file.type.startsWith('image/')){reject(new Error('請選擇圖片檔案'));return}
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error('圖片讀取失敗'));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error('圖片讀取失敗'));
   img.onload=()=>{
    const box=document.createElement('div');box.className='imageCropBackdrop';
    box.innerHTML=`<div class="imageCropModal"><div class="modalHead"><div><h3 style="margin:0">🖼️ 調整卡牌圖片</h3><div class="sub">拖曳圖片位置，滑桿調整大小</div></div><button class="small" id="cropCancelTop">✕</button></div><div id="cropCanvasWrap" class="imageCropCanvasWrap"><canvas id="cropCanvas" class="imageCropCanvas" width="300" height="400"></canvas></div><div class="imageCropHint">用滑鼠或手指拖曳上下左右</div><div class="imageCropControls"><label>圖片大小 <span id="cropZoomText">100%</span><input id="cropZoom" type="range" min="1" max="4" value="1" step="0.01"></label></div><div class="imageCropActions"><button id="cropReset" class="small">↺ 重設</button><button id="cropConfirm" class="admin">✓ 使用這個裁切</button></div></div>`;
    document.body.appendChild(box);
    const canvas=box.querySelector('#cropCanvas'),wrap=box.querySelector('#cropCanvasWrap'),ctx=canvas.getContext('2d');
    const zoomEl=box.querySelector('#cropZoom'),zoomText=box.querySelector('#cropZoomText');
    let zoom=1,ox=0,oy=0,dragging=false,lastX=0,lastY=0,settled=false;
    const baseScale=()=>Math.max(canvas.width/img.naturalWidth,canvas.height/img.naturalHeight);
    function clamp(){const sc=baseScale()*zoom,sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;const mx=Math.max(0,(sw-canvas.width)/2),my=Math.max(0,(sh-canvas.height)/2);ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy))}
    function draw(){clamp();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#080913';ctx.fillRect(0,0,canvas.width,canvas.height);const sc=baseScale()*zoom,sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;ctx.drawImage(img,(canvas.width-sw)/2+ox,(canvas.height-sh)/2+oy,sw,sh)}
    function close(result){if(settled)return;settled=true;box.remove();resolve(result)}
    function reset(){zoom=1;ox=0;oy=0;zoomEl.value='1';zoomText.textContent='100%';draw()}
    zoomEl.oninput=()=>{zoom=Number(zoomEl.value)||1;zoomText.textContent=Math.round(zoom*100)+'%';draw()};
    wrap.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;wrap.classList.add('dragging');wrap.setPointerCapture?.(e.pointerId);e.preventDefault()});
    wrap.addEventListener('pointermove',e=>{if(!dragging)return;const rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width,sy=canvas.height/rect.height;ox+=(e.clientX-lastX)*sx;oy+=(e.clientY-lastY)*sy;lastX=e.clientX;lastY=e.clientY;draw();e.preventDefault()});
    const endDrag=e=>{dragging=false;wrap.classList.remove('dragging');try{wrap.releasePointerCapture?.(e.pointerId)}catch(_){}};
    wrap.addEventListener('pointerup',endDrag);wrap.addEventListener('pointercancel',endDrag);
    box.querySelector('#cropReset').onclick=reset;
    box.querySelector('#cropCancelTop').onclick=()=>close(null);
    box.addEventListener('click',e=>{if(e.target===box)close(null)});
    box.querySelector('#cropConfirm').onclick=()=>{
     clamp();const out=document.createElement('canvas');out.width=900;out.height=1200;const octx=out.getContext('2d');const factor=out.width/canvas.width;const sc=Math.max(out.width/img.naturalWidth,out.height/img.naturalHeight)*zoom;const sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;octx.drawImage(img,(out.width-sw)/2+ox*factor,(out.height-sh)/2+oy*factor,sw,sh);out.toBlob(blob=>{if(!blob){reject(new Error('圖片裁切失敗'));box.remove();return}close(blob)},'image/webp',.88)
    };
    draw();
   };
   img.src=String(reader.result||'');
  };
  reader.readAsDataURL(file)
 })
}

function adminCardEditorHtml(c,i){const preview=c.image||'';return `<div class="adminEditor"><div class="modalHead"><div><h3>✏️ 編輯球員卡</h3><div class="sub">第 ${i+1} 張</div></div><button class="small" id="backCardList">← 返回</button></div><div class="adminEditorTop"><div class="adminEditorPreview">${preview?`<img src="${esc(preview)}" onerror="this.style.display='none'">`:'<div class="unknown">🖼️</div>'}</div><div><b>${esc(c.rarity)}｜${esc(c.name||'未命名卡牌')}</b><div class="sub" style="margin-top:6px">${esc(c.team||'未設定球隊')}　⚔️${esc(c.power||0)}</div></div></div><div class="editFields"><label style="grid-column:1/-1">卡牌圖片<input id="editImageFile_${i}" type="file" accept="image/*"></label><label>名字<input id="name_${i}" value="${esc(c.name)}"></label><label>種類<input id="type_${i}" value="${esc(c.type)}"></label><label>所屬球隊<input id="team_${i}" value="${esc(c.team)}"></label><label>稀有度<select id="rarity_${i}"><option ${c.rarity==='SSR'?'selected':''}>SSR</option><option ${c.rarity==='SR'?'selected':''}>SR</option><option ${c.rarity==='R'?'selected':''}>R</option><option ${c.rarity==='N'?'selected':''}>N</option></select></label><label>戰力<input id="power_${i}" type="number" value="${Number(c.power)||0}"></label><label style="grid-column:1/-1">介紹<textarea id="description_${i}">${esc(c.description)}</textarea></label></div><div class="adminToolbar"><button class="admin" id="saveCurrentCard">💾 儲存卡牌</button><button class="small" id="deleteCurrentCard">🗑️ 刪除卡牌</button></div><div id="adminNotice" class="notice"></div></div>`}
async function saveCard(i){if(!CARDS[i])return;try{const uploadedImage=await getUploadedImageData(i);CARDS[i]={...CARDS[i],name:$('name_'+i).value.trim(),type:$('type_'+i).value.trim(),team:$('team_'+i).value.trim(),rarity:$('rarity_'+i).value,power:Number($('power_'+i).value)||0,image:uploadedImage||CARDS[i].image||'',description:$('description_'+i).value};await cloudSaveCard(CARDS[i],i);await cardDB.set(CARDS);clearPendingCardImage(i);showCardManager(i);setTimeout(()=>{const n=$('adminNotice');if(n)n.textContent=IS_LOCAL_TEST?'✅ 卡牌已儲存在單機測試資料，不會上傳雲端':'✅ 卡牌已儲存！'},0)}catch(e){const n=$('adminNotice');if(n)n.textContent='❌ '+(e.message||e)}}
function showAdmin(){const modal=$('modal');modal.innerHTML=`<div class="modalBackdrop"><div class="modal" style="max-width:520px"><div class="modalHead"><div><h2>🛠️ 管理員後台</h2><div class="sub">選擇要管理的項目</div>${IS_LOCAL_TEST?'<div class="localModeBadge">🧪 單機隔離模式｜免密碼｜不連雲端</div>':''}</div><button class="small" id="adminExit">✕</button></div><div class="adminHomeGrid"><button id="manageCards" class="adminHomeBtn admin"><span>🎴</span>球員卡管理<small>共 ${CARDS.length} 張</small></button><button id="manageBonds" class="adminHomeBtn admin"><span>🔗</span>羈絆管理<small>共 ${BONDS.length} 組</small></button></div><div class="adminToolbar"><button id="infiniteGems" class="small">💎 獲得無限寶石</button><button id="adminLogout" class="small">🚪 登出管理員</button></div><div id="adminNotice" class="notice"></div></div></div>`;$('adminExit').onclick=()=>modal.innerHTML='';$('manageCards').onclick=()=>showCardManager();$('manageBonds').onclick=()=>showBondManager();$('infiniteGems').onclick=()=>{gems=Number.MAX_SAFE_INTEGER;save();$('adminNotice').textContent='💎 已獲得無限寶石！'};$('adminLogout').onclick=()=>{adminToken='';sessionStorage.removeItem('cp_admin_token');modal.innerHTML='';$('notice').textContent='已登出管理員'}}
function showCardManager(editIndex=null){const modal=$('modal');if(Number.isInteger(editIndex)&&CARDS[editIndex]){modal.innerHTML=`<div class="modalBackdrop"><div class="modal">${adminCardEditorHtml(CARDS[editIndex],editIndex)}</div></div>`;$('backCardList').onclick=()=>{clearPendingCardImage(editIndex);showCardManager()};$('saveCurrentCard').onclick=()=>saveCard(editIndex);const imageInput=$('editImageFile_'+editIndex);if(imageInput)imageInput.onchange=()=>handleImageFileSelection(editIndex);$('deleteCurrentCard').onclick=async()=>{if(!confirm('確定要刪除這張卡牌嗎？'))return;const removedId=CARDS[editIndex].id;await cloudDeleteCard(removedId);CARDS.splice(editIndex,1);owned=owned.filter(id=>id!==removedId);delete cardCounts[removedId];BONDS=BONDS.map(b=>({...b,cardIds:(b.cardIds||[]).filter(id=>id!==removedId)})).filter(b=>(b.cardIds||[]).length>0);await cardDB.set(CARDS);save();showCardManager()};return}modal.innerHTML=`<div class="modalBackdrop"><div class="modal"><div class="modalHead"><div><h2>🎴 球員卡管理</h2><div class="sub">點卡片才進入編輯｜共 ${CARDS.length} 張</div></div><button class="small" id="backAdmin">← 後台</button></div><div class="adminToolbar"><button id="addCard" class="admin">➕ 新增球員卡</button></div><div id="adminNotice" class="notice"></div><div class="adminCardGrid">${CARDS.map(adminCardTileHtml).join('')}</div></div></div>`;$('backAdmin').onclick=showAdmin;$('addCard').onclick=async()=>{CARDS.push({id:uid(),name:'',rarity:'N',power:0,type:'',team:'',description:'',image:''});await cloudSaveCard(CARDS[CARDS.length-1],CARDS.length-1);await cardDB.set(CARDS);showCardManager(CARDS.length-1)};document.querySelectorAll('.openCardEdit').forEach(b=>b.onclick=()=>showCardManager(Number(b.dataset.i)))}
function bondCardPickerHtml(selected=[]){return CARDS.map((c,i)=>`<label class="bondPick"><input class="bondCardCheck" type="checkbox" value="${esc(c.id)}" ${selected.includes(c.id)?'checked':''}>${c.image?`<img src="${esc(c.image)}" onerror="this.style.display='none'">`:''}<span>${esc(c.name||'未命名卡牌')}<br><small>${esc(c.rarity)}｜${esc(c.team||'')}</small></span></label>`).join('')}
function showBondManager(editIndex=null){const modal=$('modal');if(Number.isInteger(editIndex)&&BONDS[editIndex]){const b=BONDS[editIndex];modal.innerHTML=`<div class="modalBackdrop"><div class="modal"><div class="modalHead"><div><h2>🔗 編輯羈絆</h2><div class="sub">選擇會觸發羈絆的球員卡</div></div><button class="small" id="backBondList">← 返回</button></div>${bondFormHtml(b)}<div class="adminToolbar"><button id="saveBond" class="admin">💾 儲存羈絆</button><button id="deleteBond" class="small">🗑️ 刪除羈絆</button></div><div id="bondNotice" class="notice"></div></div></div>`;$('backBondList').onclick=()=>showBondManager();$('saveBond').onclick=()=>saveBondFromForm(editIndex);bindBondBonusUI();$('deleteBond').onclick=async()=>{if(!confirm('確定刪除這組羈絆嗎？'))return;const id=BONDS[editIndex].id;try{await cloudDeleteBond(id);BONDS.splice(editIndex,1);save();showBondManager()}catch(e){$('bondNotice').textContent='❌ '+(e.message||e)}};return}modal.innerHTML=`<div class="modalBackdrop"><div class="modal"><div class="modalHead"><div><h2>🔗 羈絆管理</h2><div class="sub">共 ${BONDS.length} 組羈絆</div></div><button class="small" id="backAdmin">← 後台</button></div><div class="adminToolbar"><button id="addBond" class="admin">➕ 新增羈絆</button></div><div class="bondList">${BONDS.length?BONDS.map((b,i)=>bondItemHtml(b,i)).join(''):'<div class="notice">目前還沒有羈絆。</div>'}</div></div></div>`;$('backAdmin').onclick=showAdmin;$('addBond').onclick=()=>showBondEditorNew();document.querySelectorAll('.editBond').forEach(b=>b.onclick=()=>showBondManager(Number(b.dataset.i)))}
function normalizeBondBonus(b={}){if(b.bonusType==='multiplier')return{bonusType:'multiplier',bonusValue:Number(b.bonusValue)||1};if(b.bonusType==='value')return{bonusType:'value',bonusValue:Number(b.bonusValue)||0};if(Number.isFinite(Number(b.powerBonus)))return{bonusType:'value',bonusValue:Number(b.powerBonus)||0};return{bonusType:'value',bonusValue:0}}
function bondBonusText(b={}){const x=normalizeBondBonus(b);return x.bonusType==='multiplier'?`戰力倍數 ×${Number(x.bonusValue).toFixed(2)}`:`戰力加成 +${Number(x.bonusValue)}`}
function bondItemHtml(b,i){const names=(b.cardIds||[]).map(id=>CARDS.find(c=>c.id===id)?.name||'已刪除卡牌');const limit=Number.isFinite(Number(b.battleUseLimit))&&Number(b.battleUseLimit)>0?Math.floor(Number(b.battleUseLimit)):1;return `<div class="bondItem"><div class="bondItemHead"><div><b>${esc(b.name||'未命名羈絆')}</b><div class="sub">${esc(bondBonusText(b))}｜單場最多 ${limit} 次</div></div><button class="small editBond" data-i="${i}">編輯</button></div><div class="bondPlayers">${names.map(n=>`<span class="bondChip">${esc(n)}</span>`).join('')}</div>${b.description?`<div class="sub" style="margin-top:8px">${esc(b.description)}</div>`:''}</div>`}
function bondFormHtml(b={}){const bonus=normalizeBondBonus(b);const battleUseLimit=Number.isFinite(Number(b.battleUseLimit))&&Number(b.battleUseLimit)>0?Math.floor(Number(b.battleUseLimit)):1;return `<div class="bondForm"><label>羈絆名稱<input id="bondName" value="${esc(b.name||'')}"></label><div class="bondBonusRow"><label>加成方式<select id="bondBonusType"><option value="value" ${bonus.bonusType==='value'?'selected':''}>數值加成</option><option value="multiplier" ${bonus.bonusType==='multiplier'?'selected':''}>倍數加成</option></select></label><label><span id="bondBonusLabel">${bonus.bonusType==='multiplier'?'倍數':'加成數值'}</span><input id="bondBonusValue" type="number" step="${bonus.bonusType==='multiplier'?'0.01':'1'}" min="0" value="${bonus.bonusType==='multiplier'?Number(bonus.bonusValue).toFixed(2):Number(bonus.bonusValue)}"></label></div><div id="bondBonusHint" class="bondBonusHint">${bonus.bonusType==='multiplier'?'例如 1.10 = 戰力 ×1.10':'例如 500 = 戰力 +500'}</div><div class="bondLimitRow"><label>單場可觸發次數<input id="bondBattleUseLimit" type="number" min="1" step="1" value="${battleUseLimit}"></label><div class="bondBonusHint">例如 3 = 每場比賽最多觸發 3 次</div></div><label>說明<textarea id="bondDescription">${esc(b.description||'')}</textarea></label><div><b style="font-size:12px">選擇球員卡</b><div class="bondPlayerPicker">${bondCardPickerHtml(b.cardIds||[])}</div></div></div>`}
function bindBondBonusUI(){const type=$('bondBonusType'),label=$('bondBonusLabel'),input=$('bondBonusValue'),hint=$('bondBonusHint');if(!type||!label||!input||!hint)return;const update=()=>{const mul=type.value==='multiplier';label.textContent=mul?'倍數':'加成數值';input.step=mul?'0.01':'1';if(mul&&Number(input.value)===0)input.value='1.00';hint.textContent=mul?'例如 1.10 = 戰力 ×1.10':'例如 500 = 戰力 +500'};type.onchange=update;update()}
function showBondEditorNew(){const modal=$('modal');modal.innerHTML=`<div class="modalBackdrop"><div class="modal"><div class="modalHead"><div><h2>➕ 新增羈絆</h2><div class="sub">至少選擇 2 張球員卡</div></div><button class="small" id="backBondList">← 返回</button></div>${bondFormHtml()}<div class="adminToolbar"><button id="saveBond" class="admin">💾 建立羈絆</button></div><div id="bondNotice" class="notice"></div></div></div>`;$('backBondList').onclick=()=>showBondManager();$('saveBond').onclick=()=>saveBondFromForm(null);bindBondBonusUI()}
async function saveBondFromForm(editIndex=null){const name=$('bondName').value.trim();const cardIds=[...document.querySelectorAll('.bondCardCheck:checked')].map(x=>x.value);const bonusType=$('bondBonusType').value==='multiplier'?'multiplier':'value';let bonusValue=Number($('bondBonusValue').value);let battleUseLimit=Number($('bondBattleUseLimit').value);const description=$('bondDescription').value.trim();if(!name){$('bondNotice').textContent='❌ 請輸入羈絆名稱';return}if(cardIds.length<2){$('bondNotice').textContent='❌ 羈絆至少需要 2 張球員卡';return}if(!Number.isFinite(bonusValue)||bonusValue<0){$('bondNotice').textContent='❌ 請輸入正確的加成數值';return}if(bonusType==='multiplier'&&bonusValue<=0){$('bondNotice').textContent='❌ 倍數必須大於 0';return}if(!Number.isFinite(battleUseLimit)||battleUseLimit<1){$('bondNotice').textContent='❌ 單場觸發次數至少要 1 次';return}battleUseLimit=Math.floor(battleUseLimit);if(bonusType==='value')bonusValue=Math.round(bonusValue);const data={id:Number.isInteger(editIndex)&&BONDS[editIndex]?BONDS[editIndex].id:uid(),name,cardIds,bonusType,bonusValue,battleUseLimit,description};try{await cloudSaveBond(data);if(Number.isInteger(editIndex)&&BONDS[editIndex])BONDS[editIndex]=data;else BONDS.push(data);save();showBondManager()}catch(e){$('bondNotice').textContent='❌ '+(e.message||e)}}
addEventListener('DOMContentLoaded',async()=>{if(IS_LOCAL_TEST){try{const saved=await cardDB.get();if(Array.isArray(saved)&&saved.length)CARDS=saved}catch(_e){}$('notice').textContent='🧪 單機測試模式：資料只存在本機，不會讀寫 Supabase'}else{try{await loadCloudContent();$('notice').textContent='☁️ 已連線 Supabase'}catch(e){try{const saved=await cardDB.get();if(Array.isArray(saved)&&saved.length)CARDS=saved}catch(_e){}$('notice').textContent='⚠️ 離線模式：使用快取卡池'}}owned=owned.filter(id=>CARDS.some(c=>c.id===id));save();$('collection').onclick=showCollection;$('drawMenu').onclick=showDrawMenu;$('adminBtn').onclick=adminLogin;$('daily').onclick=()=>{if(storage.getItem('test_daily_day')===day()){$('notice').textContent='⏰ 今天已領取，晚上12點後重置';return}gems+=500;storage.setItem('test_daily_day',day());save();$('notice').textContent='🎁 +500 鑽！'};$('saveGame').onclick=()=>{try{save();const data={version:8,savedAt:new Date().toISOString(),gems,owned,cardCounts,pity,daily_day:storage.getItem('test_daily_day'),collection_reward_10000:storage.getItem('test_collection_reward_10000')};const blob=new Blob([JSON.stringify(data)],{type:'application/json;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='中職抽卡模擬器_本機測試存檔_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('notice').textContent='✅ 存檔成功！'}catch(e){$('notice').textContent='❌ 存檔失敗：'+(e.message||e)}};$('loadGame').onclick=()=>$('saveFile').click();$('saveFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.owned))throw new Error('無效存檔');gems=Number(data.gems);if(!Number.isFinite(gems)||gems<0)throw new Error('鑽石資料無效');owned=data.owned.filter(id=>typeof id==='string'&&CARDS.some(c=>c.id===id));cardCounts={};if(data.cardCounts&&typeof data.cardCounts==='object'&&!Array.isArray(data.cardCounts)){for(const [id,val] of Object.entries(data.cardCounts)){if(CARDS.some(c=>c.id===id)){const n=Number(val);if(Number.isFinite(n)&&n>0)cardCounts[id]=Math.floor(n)}}}for(const id of owned)if(!cardCounts[id])cardCounts[id]=1;BONDS=Array.isArray(data.bonds)?data.bonds.map(b=>{const bonusType=b?.bonusType==='multiplier'?'multiplier':'value';const bonusValue=b?.bonusType?Number(b.bonusValue)||(bonusType==='multiplier'?1:0):Number(b?.powerBonus)||0;const battleUseLimit=Number.isFinite(Number(b?.battleUseLimit))&&Number(b.battleUseLimit)>0?Math.floor(Number(b.battleUseLimit)):1;return{...b,id:b.id||uid(),cardIds:Array.isArray(b.cardIds)?b.cardIds.filter(id=>CARDS.some(c=>c.id===id)):[],bonusType,bonusValue,battleUseLimit}}):[];pity=Number.isFinite(Number(data.pity))&&Number(data.pity)>=0?Number(data.pity):0;if(data.daily_day)storage.setItem('test_daily_day',data.daily_day);else storage.removeItem('test_daily_day');if(data.collection_reward_10000)storage.setItem('test_collection_reward_10000',data.collection_reward_10000);else storage.removeItem('test_collection_reward_10000');save();$('results').innerHTML='';$('notice').textContent='✅ 讀檔成功！'}catch(err){$('notice').textContent='❌ 讀檔失敗：'+(err.message||err)}e.target.value=''})});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>

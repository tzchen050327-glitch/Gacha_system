}

 for(const v of Array.isArray(raw?.cheerCardIds)?raw.cheerCardIds:[]){const id=String(v||'').trim();if(!id||cheerCardIds.includes(id))continue;cheerCardIds.push(id);if(cheerCardIds.length>=LINEUP_CHEER_LIMIT)break}

}

function v135WeightedPick(counts,fallback){

}

   body:{service,action,...payload},

  err.network=true;err.cause=result.error;err.code='CLIENT_INVOKE_ERROR';throw err
 }
 const envelope=result?.data||{};
 if(envelope.ok===false){
  const code=String(envelope.code||'UPSTREAM_ERROR');
  const status=Number(envelope.status)||0;
  const err=new Error(String(envelope.error||`遊戲服務錯誤 ${status||''}`));

}

function v125Clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function v125PlateProbabilities(batterAttack,pitcherDefense,fieldDefenseAvg){

 const X=(A-P)/(A+P),walk=v125Clamp(.08+.04*X,.04,.12),strikeout=v125Clamp(.20-.16*X,.08,.32);
 const D=.35*P+.65*F,Y=(A-D)/(A+D),hitRate=v125Clamp(.35+.28*Y,.10,.60);
 const hrShare=v125Clamp(.15+.12*X,.06,.27),remaining=Math.max(.001,1-hrShare),base=.62+.20+.03;
 return{X,Y,D,walk,strikeout,inPlay:1-walk,hitRate,hitInPlay:hitRate,singleShare:remaining*(.62/base),doubleShare:remaining*(.20/base),tripleShare:remaining*(.03/base),homeRunShare:hrShare}
}
function resolvePlateAppearanceV125(batterAttack,pitcherDefense,fieldDefenseAvg,randomFn=Math.random){
 const p=v125PlateProbabilities(batterAttack,pitcherDefense,fieldDefenseAvg),r=randomFn();
 if(r<p.walk)return{result:'BB',probabilities:p};
 if(randomFn()<p.hitRate){
  const h=randomFn();if(h<p.singleShare)return{result:'1B',probabilities:p};if(h<p.singleShare+p.doubleShare)return{result:'2B',probabilities:p};if(h<p.singleShare+p.doubleShare+p.tripleShare)return{result:'3B',probabilities:p};return{result:'HR',probabilities:p}
 }
 const kAmongOuts=v125Clamp(p.strikeout/Math.max(.001,1-p.hitRate),0,.85);

}

function pickSimulationCard(rarity,index=0,allowUR=false){

  const poolId=currentPool()?.id||'';
  const candidates=(allowUR?UR_ADMIN_CARDS:[]).filter(c=>!poolId||!c.pool_id||c.pool_id===poolId);
  const src=candidates.length?candidates:(allowUR?UR_ADMIN_CARDS:[]);
  return src.length?{...randomFrom(src),rarity:'UR'}:simulationFallbackCard('UR',index)
 }
 const poolCards=getPoolCards(currentPool()).filter(c=>c.rarity===rarity);

 return src.length?{...randomFrom(src)}:simulationFallbackCard(rarity,index)
}
function shuffleSimulationCards(arr){
 const out=arr.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out
}

function openImageCropper(file){
 return new Promise((resolve,reject)=>{
  if(!file||!file.type.startsWith('image/')){reject(new Error('請選擇圖片檔案'));return}
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error('圖片讀取失敗'));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error('圖片讀取失敗'));
   img.onload=()=>{
    const box=document.createElement('div');box.className='imageCropBackdrop';
    box.innerHTML=`<div class="imageCropModal"><div class="modalHead"><div><h3 style="margin:0">🖼️ 調整卡牌圖片</h3><div class="sub">前台只顯示這個 1:1 裁切；完整原圖會另外保留，之後仍可重新移動與縮放</div></div><button class="small" id="cropCancelTop">✕</button></div><div id="cropCanvasWrap" class="imageCropCanvasWrap"><canvas id="cropCanvas" class="imageCropCanvas" width="360" height="360"></canvas></div><div class="imageCropHint">用滑鼠或手指拖曳位置｜裁切只影響前台顯示，不會破壞後台保存的完整原圖</div><div class="imageCropControls"><label>圖片大小 <span id="cropZoomText">100%</span><input id="cropZoom" type="range" min="1" max="4" value="1" step="0.01"></label></div><div class="imageCropActions"><button id="cropReset" class="small">↺ 重設</button><button id="cropConfirm" class="admin">✓ 使用這個裁切</button></div></div>`;
    appOverlayRoot().appendChild(box);
    const canvas=box.querySelector('#cropCanvas'),wrap=box.querySelector('#cropCanvasWrap'),ctx=canvas.getContext('2d');
    const zoomEl=box.querySelector('#cropZoom'),zoomText=box.querySelector('#cropZoomText');
    let zoom=1,ox=0,oy=0,dragging=false,lastX=0,lastY=0,settled=false;
    const baseScale=()=>Math.max(canvas.width/img.naturalWidth,canvas.height/img.naturalHeight);
    function clamp(){const sc=baseScale()*zoom,sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;const mx=Math.max(0,(sw-canvas.width)/2),my=Math.max(0,(sh-canvas.height)/2);ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy))}
    function draw(){clamp();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#080913';ctx.fillRect(0,0,canvas.width,canvas.height);const sc=baseScale()*zoom,sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;ctx.drawImage(img,(canvas.width-sw)/2+ox,(canvas.height-sh)/2+oy,sw,sh)}
    function close(result){if(settled)return;settled=true;box.remove();resolve(result)}
    function reset(){zoom=1;ox=0;oy=0;zoomEl.value='1';zoomText.textContent='100%';draw()}
    zoomEl.oninput=()=>{zoom=Number(zoomEl.value)||1;zoomText.textContent=Math.round(zoom*100)+'%';draw()};
    wrap.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;wrap.classList.add('dragging');wrap.setPointerCapture?.(e.pointerId);e.preventDefault()});
    wrap.addEventListener('pointermove',e=>{if(!dragging)return;const rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width,sy=canvas.height/rect.height;ox+=(e.clientX-lastX)*sx;oy+=(e.clientY-lastY)*sy;lastX=e.clientX;lastY=e.clientY;draw();e.preventDefault()});
    const endDrag=e=>{dragging=false;wrap.classList.remove('dragging');try{wrap.releasePointerCapture?.(e.pointerId)}catch(_){}};
    wrap.addEventListener('pointerup',endDrag);wrap.addEventListener('pointercancel',endDrag);
    box.querySelector('#cropReset').onclick=reset;
    box.querySelector('#cropCancelTop').onclick=()=>close(null);
    box.addEventListener('click',e=>{if(e.target===box)close(null)});
    box.querySelector('#cropConfirm').onclick=()=>{
     clamp();const out=document.createElement('canvas');out.width=900;out.height=900;const octx=out.getContext('2d');const factor=out.width/canvas.width;const sc=Math.max(out.width/img.naturalWidth,out.height/img.naturalHeight)*zoom;const sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;octx.drawImage(img,(out.width-sw)/2+ox*factor,(out.height-sh)/2+oy*factor,sw,sh);out.toBlob(blob=>{if(!blob){reject(new Error('圖片裁切失敗'));box.remove();return}close(blob)},'image/webp',.88)
    };
    draw();
   };
   img.src=String(reader.result||'');
  };
  reader.readAsDataURL(file)
 })
}

function bindCardPositionRule(key){
 const el=$('position_'+key),hint=$('positionCoeff_'+key);if(!el)return;
 const apply=()=>{el.value=normalizeCardPosition(el.value);if(hint)hint.textContent=positionCoefficientText(el.value)};
 el.onchange=apply;apply()
}
function bindCardPowerRange(key){
 const rarityEl=$('rarity_'+key),powerEl=$('power_'+key),hint=$('powerRange_'+key);
 if(!rarityEl||!powerEl)return;
 const apply=()=>{
  const rarity=rarityEl.value,range=cardPowerRange(rarity);
  if(range){
   powerEl.min=String(range.min);powerEl.max=String(range.max);powerEl.step='1';
   const n=Math.floor(Number(powerEl.value));
   if(!Number.isFinite(n)||n<range.min||n>range.max)powerEl.value=String(range.min);
   if(hint)hint.textContent='允許 '+range.min+'-'+range.max;
  }else{
   powerEl.removeAttribute('min');powerEl.removeAttribute('max');powerEl.step='1';
   if(hint)hint.textContent='未限制'
  }
 };
 rarityEl.onchange=apply;apply()
}
async function saveCard(i){
 if(!CARDS[i])return;
 const key=String(i),notice=$('adminNotice_'+key)||$('adminNotice'),oldRarity=CARDS[i].rarity;
 const poolId=document.querySelector('input[name="cardPoolPick_'+key+'"]:checked')?.value||'',editorRarity=$('rarity_'+key)?.value||CARDS[i].rarity;
 if(!poolId&&String(editorRarity).toUpperCase()!=='SP'){if(notice)notice.textContent='❌ 請選擇 1 個所屬卡池';return}
 const name=$('name_'+key)?.value.trim()||'';if(!name){if(notice)notice.textContent='❌ 請輸入球員名字';return}
 const rarity=$('rarity_'+key)?.value||'N',powerCheck=validateCardPower(rarity,$('power_'+key)?.value);
 if(!powerCheck.ok){if(notice)notice.textContent='❌ '+powerCheck.message;return}
 const oldId=CARDS[i].id;
 try{
  if(notice)notice.textContent='儲存中…';
  const uploaded=await getUploadedImageData(i);
  const card={...CARDS[i],name,type:$('type_'+key)?.value.trim()||'',position:normalizeCardPosition($('position_'+key)?.value),team:$('team_'+key)?.value.trim()||'',rarity,power:powerCheck.value,image:uploaded?.imageUrl||CARDS[i].image||'',originalImage:uploaded?.originalImageUrl||CARDS[i].originalImage||CARDS[i].image||'',description:$('description_'+key)?.value||''};
  await cloudSaveCard(card,i,poolId);
  CARDS[i]=card;
  ADMIN_POOLS=ADMIN_POOLS.map(p=>{const ids=new Set(p.cardIds||[]);if(p.id===poolId)ids.add(card.id);else ids.delete(card.id);return{...p,cardIds:[...ids]}});
  syncVisiblePoolsFromAdmin();await cardDB.set(CARDS);save();

  /* 搜尋模式儲存後重新套用跨稀有度搜尋條件。 */
  if(ADMIN_CARD_SEARCH_QUERY){
   clearPendingCardImage(i);
   await showCardManager(card.rarity,oldId,'✅ 已儲存，可繼續搜尋與左右滑動',ADMIN_CARD_SEARCH_QUERY,ADMIN_CARD_POSITION_FILTER);
   return
  }

  /* 稀有度沒變時不重畫管理頁，真正停留在同一張卡、同一滑動位置。 */
  if(card.rarity===oldRarity){
   const slide=document.querySelector(`.adminCardEditorSlide[data-card-id="${CSS.escape(oldId)}"]`);
   const title=slide?.querySelector('.adminCardSlideTitle');if(title)title.textContent=card.rarity+'｜'+(card.name||'未命名球員');
   const hero=$('adminEditorPreview_'+key);
   if(hero&&uploaded)hero.innerHTML=`<img src="${esc(card.image)}" onerror="this.style.display='none'">`;
   clearPendingCardImage(i);
   if(notice)notice.textContent='✅ 已儲存，可直接繼續左右滑動';
   return
  }

  /* 若修改了稀有度，該卡會移到新的分類，因此切到新分類並定位同一張卡。 */
  clearPendingCardImage(i);
  await showCardManager(card.rarity,oldId,'✅ 已儲存，卡牌已移到 '+card.rarity+' 分類','',ADMIN_CARD_POSITION_FILTER)
 }catch(e){if(notice)notice.textContent='❌ '+(e.message||e)}
}

(function v143DisableLongPressSelection(){
  const editableTarget=(target)=>{
    if(!(target instanceof Element))return false;
    return !!target.closest('input,textarea,[contenteditable="true"]');
  };

  document.addEventListener('contextmenu',e=>{
    if(editableTarget(e.target))return;
    e.preventDefault();
  },{capture:true});

  document.addEventListener('selectstart',e=>{
    if(editableTarget(e.target))return;
    e.preventDefault();
  },{capture:true});

  document.addEventListener('dragstart',e=>{
    if(editableTarget(e.target))return;
    e.preventDefault();
  },{capture:true});

  document.addEventListener('DOMContentLoaded',()=>{
    document.querySelectorAll('img').forEach(img=>{
      img.draggable=false;
      img.setAttribute('draggable','false');
    });
  });
})();

async function v207LocalEconomyApi(action,payload={}){

 const mail={id:'local_starter_v207',mail_key:'starter_gift_v207',title:'新手大禮包',body:'歡迎加入遊戲！為你準備了新手大禮包，領取後即可開始組建你的球隊。',attachments:[{kind:'card',card_id:V207_SP_CARD_ID,label:'SP｜傳奇終結者',amount:1},{kind:'gems',label:'鑽石',amount:5000},{kind:'ssr_ticket',label:'SSR 必中券',amount:1}],created_at:new Date().toISOString(),claimed_at:claimed?new Date().toISOString():null};

  if(!claimed){gems+=5000;V207_SSR_TICKETS+=1;if(!owned.includes(V207_SP_CARD_ID))owned.push(V207_SP_CARD_ID);cardCounts[V207_SP_CARD_ID]=Math.max(1,Number(cardCounts[V207_SP_CARD_ID])||0);storage.setItem(mailKey,'1');save()}
  return{ok:true,claimed:claimed?0:1,progress:currentProgressPayload(),mails:[{...mail,claimed_at:new Date().toISOString()}],unclaimed_count:0}
 }
 if(action==='spend_gems'){const count=Number(payload.count)===10?10:1,cost=count===10?900:100;if(gems<cost)throw new Error('鑽石不夠！');gems-=cost;save();return{ok:true,cost,gems}}
 if(action==='use_ssr_ticket'){
  if(V207_SSR_TICKETS<=0)throw new Error('沒有 SSR 必中券');
  const pool=CARDS.filter(c=>String(c.rarity).toUpperCase()==='SSR'&&!owned.includes(c.id));

 }

  const b=$('v207ClaimAll'),rewards=pending.flatMap(m=>Array.isArray(m.attachments)?m.attachments:[]);b.disabled=true;
  try{const d=await v207EconomyApi('claim_all_mail');if(d?.progress)applyPlayerProgress(d.progress);await v207RefreshMailboxBadge();if(Number(d?.claimed)>0){modal.innerHTML='';await v207PlayRewardSequence(rewards,'全部領取');await openV207Mailbox()}else{if(msg)msg.textContent='無可領取的物品';b.disabled=false}}
  catch(e){alert(e.message||e);b.disabled=false}
 }
}

async function openV207Mailbox(message=''){
 const modal=$('modal');modal.innerHTML='<div class="modalBackdrop"><div class="modal v207MailModal"><div class="modalHead"><h2>✉️ 信箱</h2><button class="small" id="v207MailLoadingClose">✕</button></div><div class="notice">讀取信件中…</div></div></div>';$('v207MailLoadingClose').onclick=()=>modal.innerHTML='';
 try{const d=await v207EconomyApi('list_mail');if(d?.progress)applyPlayerProgress(d.progress);const mails=Array.isArray(d?.mails)?d.mails:[];const dot=$('mailboxDot');if(dot)dot.hidden=!mails.some(m=>!m.claimed_at);v207RenderMailbox(mails,message)}catch(e){modal.innerHTML=`<div class="modalBackdrop"><div class="modal v207MailModal"><div class="modalHead"><h2>✉️ 信箱</h2><button class="small" id="v207MailFailClose">✕</button></div><div class="notice">❌ ${esc(e.message||e)}</div></div></div>`;$('v207MailFailClose').onclick=()=>modal.innerHTML=''}
}
async function v207UseSsrTicket(){
 const btn=$('v207SsrTicketDraw')||$('drawSingle'),note=$('v207TicketNotice');if(btn)btn.disabled=true;if(note)note.textContent='抽取未擁有的 SSR 中…';
 try{
  const d=await v207EconomyApi('use_ssr_ticket');
  if(d?.status==='all_owned'){if(note)note.textContent='✅ SSR 已全收集，必中券不會消耗';V207_SSR_TICKETS=Math.max(0,Number(d.ssr_tickets)||0);return}
  if(d?.status!=='ok'||!d.card)throw new Error('SSR 必中券抽取失敗');
  if(d.progress)applyPlayerProgress(d.progress);else v207SyncEconomyState(d);
  const card=cardFromRow(d.card),newFlags=[true];$('modal').innerHTML='';
  await playDrawAnimation([card],newFlags,null,{title:'🎟️ SSR 必中券',noAgain:true});
  $('notice').textContent='🎟️ SSR 必中券獲得：'+(card.name||'SSR 球員');await v207RefreshMailboxBadge()
 }catch(e){if(note)note.textContent='❌ '+(e.message||e);else $('notice').textContent='❌ '+(e.message||e)}finally{const b=$('v207SsrTicketDraw')||$('drawSingle');if(b)b.disabled=false}
}

/* 每次重新載入雲端卡片後確保 SP 固定使用黑金剪影。 */
const v207LoadCloudContentBase=loadCloudContent;
loadCloudContent=async function(){const r=await v207LoadCloudContentBase.apply(this,arguments);v207EnsureSpCard();return r};
const v207InitBase=initializeGame;
initializeGame=async function(){const r=await v207InitBase.apply(this,arguments);v207EnsureSpCard();await v207RefreshMailboxBadge();return r};

function showBondManager(editIndex=null){const modal=$('modal');if(Number.isInteger(editIndex)&&BONDS[editIndex]){const b=BONDS[editIndex];modal.innerHTML=`<div class="modalBackdrop"><div class="modal"><div class="modalHead"><div><h2>🔗 編輯羈絆</h2><div class="sub">選擇會觸發羈絆的球員卡</div></div><button class="small" id="backBondList">← 返回</button></div>${bondFormHtml(b)}<div class="adminToolbar"><button id="saveBond" class="admin">💾 儲存羈絆</button><button id="deleteBond" class="small">🗑️ 刪除羈絆</button></div><div id="bondNotice" class="notice"></div></div></div>`;$('backBondList').onclick=()=>showBondManager();$('saveBond').onclick=()=>saveBondFromForm(editIndex);bindBondBonusUI();$('deleteBond').onclick=async()=>{if(!confirm('確定刪除這組羈絆嗎？'))return;const id=BONDS[editIndex].id;try{await cloudDeleteBond(id);BONDS.splice(editIndex,1);save();showBondManager()}catch(e){$('bondNotice').textContent='❌ '+(e.message||e)}};return}modal.innerHTML=`<div class="modalBackdrop"><div class="modal"><div class="modalHead"><div><h2>🔗 羈絆管理</h2><div class="sub">共 ${BONDS.length} 組羈絆</div></div><button class="small" id="backAdmin">← 後台</button></div><div class="adminToolbar"><button id="addBond" class="admin">➕ 新增羈絆</button></div><div class="bondList">${BONDS.length?BONDS.map((b,i)=>bondItemHtml(b,i)).join(''):'<div class="notice">目前還沒有羈絆。</div>'}</div></div></div>`;$('backAdmin').onclick=showAdmin;$('addBond').onclick=()=>showBondEditorNew();document.querySelectorAll('.editBond').forEach(b=>b.onclick=()=>showBondManager(Number(b.dataset.i)))}
function normalizeBondBonus(b={}){if(b.bonusType==='multiplier')return{bonusType:'multiplier',bonusValue:Number(b.bonusValue)||1};if(b.bonusType==='value')return{bonusType:'value',bonusValue:Number(b.bonusValue)||0};if(Number.isFinite(Number(b.powerBonus)))return{bonusType:'value',bonusValue:Number(b.powerBonus)||0};return{bonusType:'value',bonusValue:0}}
function bondBonusText(b={}){const x=normalizeBondBonus(b);return x.bonusType==='multiplier'?`戰力倍數 ×${Number(x.bonusValue).toFixed(2)}`:`戰力加成 +${Number(x.bonusValue)}`}
function bondItemHtml(b,i){const names=(b.cardIds||[]).map(id=>CARDS.find(c=>c.id===id)?.name||'已刪除卡牌');const limit=Number.isFinite(Number(b.battleUseLimit))&&Number(b.battleUseLimit)>0?Math.floor(Number(b.battleUseLimit)):1;return `<div class="bondItem"><div class="bondItemHead"><div><b>${esc(b.name||'未命名羈絆')}</b><div class="sub">${esc(bondBonusText(b))}｜單場最多 ${limit} 次</div></div><button class="small editBond" data-i="${i}">編輯</button></div><div class="bondPlayers">${names.map(n=>`<span class="bondChip">${esc(n)}</span>`).join('')}</div>${b.description?`<div class="sub" style="margin-top:8px">${esc(b.description)}</div>`:''}</div>`}
function bondFormHtml(b={}){const bonus=normalizeBondBonus(b);const battleUseLimit=Number.isFinite(Number(b.battleUseLimit))&&Number(b.battleUseLimit)>0?Math.floor(Number(b.battleUseLimit)):1;return `<div class="bondForm"><label>羈絆名稱<input id="bondName" value="${esc(b.name||'')}"></label><div class="bondBonusRow"><label>加成方式<select id="bondBonusType"><option value="value" ${bonus.bonusType==='value'?'selected':''}>數值加成</option><option value="multiplier" ${bonus.bonusType==='multiplier'?'selected':''}>倍數加成</option></select></label><label><span id="bondBonusLabel">${bonus.bonusType==='multiplier'?'倍數':'加成數值'}</span><input id="bondBonusValue" type="number" step="${bonus.bonusType==='multiplier'?'0.01':'1'}" min="0" value="${bonus.bonusType==='multiplier'?Number(bonus.bonusValue).toFixed(2):Number(bonus.bonusValue)}"></label></div><div id="bondBonusHint" class="bondBonusHint">${bonus.bonusType==='multiplier'?'例如 1.10 = 戰力 ×1.10':'例如 500 = 戰力 +500'}</div><div class="bondLimitRow"><label>單場可觸發次數<input id="bondBattleUseLimit" type="number" min="1" step="1" value="${battleUseLimit}"></label><div class="bondBonusHint">例如 3 = 每場比賽最多觸發 3 次</div></div><label>說明<textarea id="bondDescription">${esc(b.description||'')}</textarea></label><div><b style="font-size:12px">選擇球員卡</b><div class="bondPlayerPicker">${bondCardPickerHtml(b.cardIds||[])}</div></div></div>`}
function bindBondBonusUI(){const type=$('bondBonusType'),label=$('bondBonusLabel'),input=$('bondBonusValue'),hint=$('bondBonusHint');if(!type||!label||!input||!hint)return;const update=()=>{const mul=type.value==='multiplier';label.textContent=mul?'倍數':'加成數值';input.step=mul?'0.01':'1';if(mul&&Number(input.value)===0)input.value='1.00';hint.textContent=mul?'例如 1.10 = 戰力 ×1.10':'例如 500 = 戰力 +500'};type.onchange=update;update()}
function showBondEditorNew(){const modal=$('modal');modal.innerHTML=`<div class="modalBackdrop"><div class="modal"><div class="modalHead"><div><h2>➕ 新增羈絆</h2><div class="sub">至少選擇 2 張球員卡</div></div><button class="small" id="backBondList">← 返回</button></div>${bondFormHtml()}<div class="adminToolbar"><button id="saveBond" class="admin">💾 建立羈絆</button></div><div id="bondNotice" class="notice"></div></div></div>`;$('backBondList').onclick=()=>showBondManager();$('saveBond').onclick=()=>saveBondFromForm(null);bindBondBonusUI()}
async function saveBondFromForm(editIndex=null){const name=$('bondName').value.trim();const cardIds=[...document.querySelectorAll('.bondCardCheck:checked')].map(x=>x.value);const bonusType=$('bondBonusType').value==='multiplier'?'multiplier':'value';let bonusValue=Number($('bondBonusValue').value);let battleUseLimit=Number($('bondBattleUseLimit').value);const description=$('bondDescription').value.trim();if(!name){$('bondNotice').textContent='❌ 請輸入羈絆名稱';return}if(cardIds.length<2){$('bondNotice').textContent='❌ 羈絆至少需要 2 張球員卡';return}if(!Number.isFinite(bonusValue)||bonusValue<0){$('bondNotice').textContent='❌ 請輸入正確的加成數值';return}if(bonusType==='multiplier'&&bonusValue<=0){$('bondNotice').textContent='❌ 倍數必須大於 0';return}if(!Number.isFinite(battleUseLimit)||battleUseLimit<1){$('bondNotice').textContent='❌ 單場觸發次數至少要 1 次';return}battleUseLimit=Math.floor(battleUseLimit);if(bonusType==='value')bonusValue=Math.round(bonusValue);const data={id:Number.isInteger(editIndex)&&BONDS[editIndex]?BONDS[editIndex].id:uid(),name,cardIds,bonusType,bonusValue,battleUseLimit,description};try{await cloudSaveBond(data);if(Number.isInteger(editIndex)&&BONDS[editIndex])BONDS[editIndex]=data;else BONDS.push(data);save();showBondManager()}catch(e){$('bondNotice').textContent='❌ '+(e.message||e)}}
addEventListener('DOMContentLoaded',async()=>{if(IS_LOCAL_TEST){try{const saved=await cardDB.get();if(Array.isArray(saved)&&saved.length)CARDS=saved}catch(_e){}$('notice').textContent='🧪 單機測試模式：資料只存在本機，不會讀寫 Supabase'}else{try{await loadCloudContent();$('notice').textContent='☁️ 已連線 Supabase'}catch(e){try{const saved=await cardDB.get();if(Array.isArray(saved)&&saved.length)CARDS=saved}catch(_e){}const cachedPools=safeJSON('test_pools',null);if(Array.isArray(cachedPools)&&cachedPools.length)POOLS=cachedPools;$('notice').textContent='⚠️ 離線模式：使用快取卡池'}}if(!POOLS.some(p=>p.id===ACTIVE_POOL_ID))ACTIVE_POOL_ID=POOLS[0]?.id||'';owned=owned.filter(id=>CARDS.some(c=>c.id===id));save();$('collection').onclick=()=>showCollection('default','SSR');$('drawMenu').onclick=showDrawMenu;$('lobbyChat').onclick=openLobbyChat;let versionTapCount=0,versionTapTimer=0;const versionEl=$('appVersion');if(versionEl)versionEl.onclick=()=>{versionTapCount++;clearTimeout(versionTapTimer);versionTapTimer=setTimeout(()=>{versionTapCount=0},2000);if(versionTapCount>=5){versionTapCount=0;clearTimeout(versionTapTimer);adminLogin()}};$('daily').onclick=()=>{if(storage.getItem('test_daily_day')===day()){$('notice').textContent='⏰ 今天已領取，晚上12點後重置';return}gems+=1500;storage.setItem('test_daily_day',day());save();$('notice').textContent='🎁 +1500 鑽！'};});
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script></body></html>

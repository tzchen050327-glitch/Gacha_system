  const [cr,br,pr,lr,chr,chp]=await Promise.all([
    supa.from('cards').select('*').order('sort_order'),
    supa.from('bonds').select('*').order('created_at'),
    supa.from('gacha_pools').select('*').order('sort_order'),
    supa.from('gacha_pool_cards').select('pool_id,card_id'),
    supa.from('cheer_cards').select('*').order('sort_order'),
    supa.from('cheer_pool_settings').select('*').eq('id','default').maybeSingle()
  ]);
  if(cr.error)throw cr.error;if(br.error)throw br.error;if(pr.error)throw pr.error;if(lr.error)throw lr.error;if(chr.error)throw chr.error;if(chp.error)throw chp.error;

  storage.setItem('test_bonds',JSON.stringify(BONDS));storage.setItem('test_pools',JSON.stringify(POOLS));storage.setItem('cp_cheer_cards_cache',JSON.stringify(CHEER_CARDS));storage.setItem('cp_cheer_pool_cache',JSON.stringify(CHEER_POOL));storage.setItem('test_active_pool_id',ACTIVE_POOL_ID);

function emptyV124Deck(){return{starters:[],bench:[],cheerCardIds:[]}}
function normalizeV124Deck(raw){
 const starters=[],bench=[],cheerCardIds=[],used=new Set();
 for(const v of Array.isArray(raw?.starters)?raw.starters:[]){const id=String(v||'').trim();if(!id||used.has(id))continue;used.add(id);starters.push(id);if(starters.length>=LINEUP_STARTER_LIMIT)break}
 for(const v of Array.isArray(raw?.bench)?raw.bench:[]){const id=String(v||'').trim();if(!id||used.has(id))continue;used.add(id);bench.push(id);if(bench.length>=LINEUP_BENCH_LIMIT)break}
 for(const v of Array.isArray(raw?.cheerCardIds)?raw.cheerCardIds:[]){const id=String(v||'').trim();if(!id||cheerCardIds.includes(id))continue;cheerCardIds.push(id);if(cheerCardIds.length>=LINEUP_CHEER_LIMIT)break}
 return{starters,bench,cheerCardIds}
}
function normalizeV124Decks(raw){const a=Array.isArray(raw)?raw:[];return Array.from({length:LINEUP_DECK_COUNT},(_,i)=>normalizeV124Deck(a[i]))}

function lineupPlayerCardById(id){return CARDS.find(c=>String(c.id)===String(id))||UR_OWNED_CARDS.find(c=>String(c.id)===String(id))||null}
function lineupCheerCardById(id){return CHEER_CARDS.find(c=>String(c.id)===String(id))||null}
function lineupAttackValue(c){if(!c)return 0;if(c.rarity==='UR'&&!c.position)return Math.round(Number(c.power)||0);return cardAttackValue(c)}
function lineupDefenseValue(c){if(!c)return 0;if(c.rarity==='UR'&&!c.position)return Math.round(Number(c.power)||0);return cardDefenseValue(c)}
function lineupCoeffText(c){if(!c)return'';return c.rarity==='UR'&&!c.position?'UR：進攻 ×1.00｜防守 ×1.00':positionCoefficientText(c.position)}
function lineupPositionText(c){if(!c)return'';return c.rarity==='UR'&&!c.position?'UR特殊':normalizeCardPosition(c.position)}
function lineupDeckCounts(deck){const d=normalizeV124Deck(deck);return{starters:d.starters.length,bench:d.bench.length,cheer:d.cheerCardIds.length}}
function lineupDeckPower(deck){
 const d=normalizeV124Deck(deck);let attack=0,defense=0;
 for(const id of [...d.starters,...d.bench]){const c=lineupPlayerCardById(id);attack+=lineupAttackValue(c);defense+=lineupDefenseValue(c)}
 return{attack,defense}
}
function lineupDeckComplete(deck){const c=lineupDeckCounts(deck);return c.starters===9}
function lineupDeckRarityCounts(deck,excludeId=''){
 const d=normalizeV124Deck(deck),ids=[...d.starters,...d.bench].filter(id=>String(id)!==String(excludeId||''));
 let ur=0,ssr=0;
 for(const id of ids){const c=lineupPlayerCardById(id),r=String(c?.rarity||'').toUpperCase();if(r==='UR')ur++;else if(r==='SSR')ssr++}
 return{ur,ssr,high:ur+ssr}
}
function lineupCanAddRarity(rarity,deck,excludeId=''){
 const r=String(rarity||'').toUpperCase(),c=lineupDeckRarityCounts(deck,excludeId);
 if(r==='UR')return c.ur<1&&c.high<3;
 if(r==='SSR')return c.high<3;
 return true
}
function lineupCanPlaceCard(card,deck,excludeId=''){return !!card&&lineupCanAddRarity(card.rarity,deck,excludeId)}
function lineupOwnedHasUR(){return UR_OWNED_CARDS.length>0}

function lineupCacheKey(){return 'cp_lineup_v124_cache'}
function cacheV124Lineups(){storage.setItem(lineupCacheKey(),JSON.stringify({decks:LINEUP_DECKS,activeDeck:LINEUP_ACTIVE_DECK}))}
function updateGameLineupSummary(){
 const el=$('gameLineupSummary');if(!el)return;const deck=LINEUP_DECKS[Math.max(0,LINEUP_ACTIVE_DECK-1)]||emptyV124Deck(),c=lineupDeckCounts(deck);
 el.textContent=`牌組 ${LINEUP_ACTIVE_DECK}｜先發 ${c.starters}/9・替補 ${c.bench}/3・應援 ${c.cheer}/2`
}
async function localV124LineupApi(action,payload={}){
 let state=safeJSON('cp_local_lineup_v124',{decks:Array.from({length:5},()=>emptyV124Deck()),activeDeck:1});
 state={decks:normalizeV124Decks(state?.decks),activeDeck:Math.max(1,Math.min(5,Number(state?.activeDeck)||1))};
 if(action==='get')return state;
 if(action==='save_deck'){const i=Math.max(1,Math.min(5,Number(payload.deckIndex)||1));state.decks[i-1]=normalizeV124Deck(payload.deck);storage.setItem('cp_local_lineup_v124',JSON.stringify(state));return{ok:true,...state}}
 if(action==='set_active'){state.activeDeck=Math.max(1,Math.min(5,Number(payload.activeDeck)||1));storage.setItem('cp_local_lineup_v124',JSON.stringify(state));return{ok:true,...state}}
 if(action==='save_all'){state.decks=normalizeV124Decks(payload.decks);state.activeDeck=Math.max(1,Math.min(5,Number(payload.activeDeck)||1));storage.setItem('cp_local_lineup_v124',JSON.stringify(state));return{ok:true,...state}}
 throw new Error('Unknown lineup action')
}
async function v124LineupApi(action,payload={}){
 if(IS_LOCAL_TEST)return localV124LineupApi(action,payload);
 if(!PLAYER_TOKEN)throw new Error('玩家尚未登入');
 const res=await fetch(LINEUP_API,{method:'POST',headers:{'Content-Type':'application/json','x-player-token':PLAYER_TOKEN},body:JSON.stringify({action,...payload})});
 let data={};try{data=await res.json()}catch(_e){}
 if(!res.ok){const err=new Error(data.error||('排組 API 錯誤 '+res.status));err.status=res.status;throw err}
 return data
}
async function loadV124Lineups(force=false){
 if(LINEUP_LOADED&&!force){updateGameLineupSummary();return}
 try{
  const data=await v124LineupApi('get');LINEUP_DECKS=normalizeV124Decks(data.decks);LINEUP_ACTIVE_DECK=Math.max(1,Math.min(5,Number(data.activeDeck)||1));LINEUP_EDIT_DECK=LINEUP_ACTIVE_DECK;LINEUP_LOADED=true;cacheV124Lineups();updateGameLineupSummary()
 }catch(e){
  const cached=safeJSON(lineupCacheKey(),null);
  if(cached){LINEUP_DECKS=normalizeV124Decks(cached.decks);LINEUP_ACTIVE_DECK=Math.max(1,Math.min(5,Number(cached.activeDeck)||1));LINEUP_EDIT_DECK=LINEUP_ACTIVE_DECK;LINEUP_LOADED=true;updateGameLineupSummary();return}
  throw e
 }
}
function v124CurrentDraft(){if(!LINEUP_DRAFTS)LINEUP_DRAFTS=cloneV124Decks(LINEUP_DECKS);return LINEUP_DRAFTS[LINEUP_EDIT_DECK-1]}
function v124MarkDirty(){LINEUP_DIRTY.add(LINEUP_EDIT_DECK)}
function v124UsedPlace(cardId,deck=v124CurrentDraft()){
 const s=deck.starters.indexOf(cardId);if(s>=0)return`先發 ${s+1}`;
 const b=deck.bench.indexOf(cardId);if(b>=0)return`替補 ${b+1}`;
 return''
}
function v124SetPlayerSlot(kind,index,cardId){
 const d=v124CurrentDraft(),id=String(cardId||''),oldId=String((kind==='starter'?d.starters[index]:d.bench[index])||''),card=lineupPlayerCardById(id);
 if(id&&card&&!lineupCanPlaceCard(card,d,oldId)){const hasUR=lineupOwnedHasUR();alert(hasUR?(String(card.rarity).toUpperCase()==='UR'?'每個牌組最多 1 張 UR，且 SSR＋UR 合計最多 3 張。':'每個牌組 SSR＋UR 合計最多 3 張。'):'每個牌組最多 3 張 SSR。');return}
 d.starters=d.starters.filter(x=>x!==id);d.bench=d.bench.filter(x=>x!==id);
 if(kind==='starter'){
  const arr=[...d.starters];while(arr.length<=index)arr.push('');arr[index]=id;d.starters=arr.filter(Boolean).slice(0,9)
 }else{
  const arr=[...d.bench];while(arr.length<=index)arr.push('');arr[index]=id;d.bench=arr.filter(Boolean).slice(0,3)
 }
 LINEUP_DRAFTS[LINEUP_EDIT_DECK-1]=normalizeV124Deck(d);v124MarkDirty();showLineupSettings(LINEUP_EDIT_DECK,'players',false)
}
function v124ClearPlayerSlot(kind,index){
 const d=v124CurrentDraft();
 if(kind==='starter')d.starters.splice(index,1);else d.bench.splice(index,1);
 LINEUP_DRAFTS[LINEUP_EDIT_DECK-1]=normalizeV124Deck(d);v124MarkDirty();showLineupSettings(LINEUP_EDIT_DECK,'players',false)
}
function v124SetCheerSlot(index,cardId){
 const d=v124CurrentDraft(),id=String(cardId||'');let arr=[...d.cheerCardIds];arr=arr.filter(x=>x!==id);while(arr.length<=index)arr.push('');arr[index]=id;d.cheerCardIds=arr.filter(Boolean).slice(0,2);
 LINEUP_DRAFTS[LINEUP_EDIT_DECK-1]=normalizeV124Deck(d);v124MarkDirty();showLineupSettings(LINEUP_EDIT_DECK,'cheer',false)
}
function v124ClearCheerSlot(index){const d=v124CurrentDraft();d.cheerCardIds.splice(index,1);LINEUP_DRAFTS[LINEUP_EDIT_DECK-1]=normalizeV124Deck(d);v124MarkDirty();showLineupSettings(LINEUP_EDIT_DECK,'cheer',false)}
function v124AutoBuild(){
 const cards=lineupAllPlayerCards().sort((a,b)=>{
  const score=c=>lineupAttackValue(c)*.55+lineupDefenseValue(c)*.45;
  return score(b)-score(a)||(Number(b.power)||0)-(Number(a.power)||0)
 });
 const d=emptyV124Deck(),picked=[];
 for(const c of cards){if(picked.length>=12)break;if(!lineupCanPlaceCard(c,d))continue;picked.push(c.id);if(picked.length<=9)d.starters.push(c.id);else d.bench.push(c.id)}
 d.cheerCardIds=CHEER_CARDS.filter(c=>owned.includes(c.id)&&c.isActive!==false).sort((a,b)=>(Number(b.effectValue)||0)-(Number(a.effectValue)||0)).slice(0,2).map(c=>c.id);
 LINEUP_DRAFTS[LINEUP_EDIT_DECK-1]=normalizeV124Deck(d);v124MarkDirty();showLineupSettings(LINEUP_EDIT_DECK,LINEUP_TAB,false)
}
function v124ClearDeck(){LINEUP_DRAFTS[LINEUP_EDIT_DECK-1]=emptyV124Deck();v124MarkDirty();showLineupSettings(LINEUP_EDIT_DECK,LINEUP_TAB,false)}

async function saveV124CurrentDeck(useAfter=false){
 const btn=$('v124SaveDeck'),useBtn=$('v124SaveUse'),notice=$('v124LineupNotice'),idx=LINEUP_EDIT_DECK,d=normalizeV124Deck(v124CurrentDraft());
 if(btn)btn.disabled=true;if(useBtn)useBtn.disabled=true;if(notice)notice.textContent=useAfter?'儲存並切換使用牌組中…':'儲存中…';
 try{
  const data=await v124LineupApi('save_deck',{deckIndex:idx,deck:d});
  LINEUP_DECKS=normalizeV124Decks(data.decks);LINEUP_ACTIVE_DECK=Math.max(1,Math.min(5,Number(data.activeDeck)||LINEUP_ACTIVE_DECK));LINEUP_DRAFTS=cloneV124Decks(LINEUP_DECKS);LINEUP_DIRTY.delete(idx);
  if(useAfter){
   const active=await v124LineupApi('set_active',{activeDeck:idx});LINEUP_ACTIVE_DECK=Math.max(1,Math.min(5,Number(active.activeDeck)||idx));LINEUP_DECKS=normalizeV124Decks(active.decks||LINEUP_DECKS);LINEUP_DRAFTS=cloneV124Decks(LINEUP_DECKS)
  }
  cacheV124Lineups();updateGameLineupSummary();showLineupSettings(idx,LINEUP_TAB,false);
  setTimeout(()=>{const n=$('v124LineupNotice');if(n)n.textContent=useAfter?'✅ 已儲存並設為使用中':'✅ 牌組已儲存'},0)
 }catch(e){if(notice)notice.textContent='❌ '+(e.message||e);if(btn)btn.disabled=false;if(useBtn)useBtn.disabled=false}
}

function v127AdvanceHalf(){
 const s=V127_BATTLE;if(!s||s.finished)return;

  // 3 局以後，如果後攻方在上半局結束時已領先，無須再打下半局
  if(s.inning>=3){
   const home=v127HomeTeam(s),homeScore=home==='player'?s.playerScore:s.opponentScore,awayScore=home==='player'?s.opponentScore:s.playerScore;
   if(homeScore>awayScore){v127FinishGame();return}
  }
  s.half='bottom';v127StartHalf();return
 }
 // 下半局結束：3 局以前照常進下一局
 if(s.inning<3){s.inning++;s.half='top';v127StartHalf();return}
 // 已有勝負就結束

}

function v125Clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function v125PlateProbabilities(batterAttack,pitcherDefense,fieldDefenseAvg){
 const A=Math.max(1,Number(batterAttack)||1),P=Math.max(1,Number(pitcherDefense)||1),F=Math.max(1,Number(fieldDefenseAvg)||1);
 const X=(A-P)/(A+P),walk=v125Clamp(.08+.04*X,.04,.12),strikeout=v125Clamp(.20-.16*X,.08,.32),inPlay=Math.max(0,1-walk-strikeout);
 const D=.35*P+.65*F,Y=(A-D)/(A+D),hitInPlay=v125Clamp(.35+.18*Y,.22,.48);
 const hrShare=v125Clamp(.15+.12*X,.06,.27),remaining=Math.max(.001,1-hrShare),base=.62+.20+.03;
 return{X,walk,strikeout,inPlay,hitInPlay,singleShare:remaining*(.62/base),doubleShare:remaining*(.20/base),tripleShare:remaining*(.03/base),homeRunShare:hrShare}
}
function resolvePlateAppearanceV125(batterAttack,pitcherDefense,fieldDefenseAvg,randomFn=Math.random){
 const p=v125PlateProbabilities(batterAttack,pitcherDefense,fieldDefenseAvg),r=randomFn();
 if(r<p.walk)return{result:'BB',probabilities:p};
 if(r<p.walk+p.strikeout)return{result:'K',probabilities:p};
 if(randomFn()>=p.hitInPlay)return{result:'OUT',probabilities:p};
 const h=randomFn();if(h<p.singleShare)return{result:'1B',probabilities:p};if(h<p.singleShare+p.doubleShare)return{result:'2B',probabilities:p};if(h<p.singleShare+p.doubleShare+p.tripleShare)return{result:'3B',probabilities:p};return{result:'HR',probabilities:p}
}

function drawSfxTone(ctx,freq,start=0,dur=.12,vol=.1,type='sine',endFreq=0){

  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.03)
 }catch(_e){}
}
function drawSfxNoise(ctx,start=0,dur=.1,vol=.05){
 try{
  const sr=ctx.sampleRate,len=Math.max(1,Math.floor(sr*dur)),buf=ctx.createBuffer(1,len,sr),d=buf.getChannelData(0);

  g.gain.setValueAtTime(Math.max(.0002,vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(g);g.connect(ctx.destination);s.start(t);s.stop(t+dur+.02)
 }catch(_e){}
}
function playDrawSfx(kind,rarity=''){

 const r=String(rarity||'').toUpperCase();
 if(kind==='start'){
  /* 啟動：輪盤高速轉動後減速的機械刻度聲 */
  drawSfxNoise(ctx,0,.78,.035);
  drawSfxTone(ctx,78,0,.76,.045,'sawtooth',150);
  const ticks=[0,.045,.09,.135,.18,.23,.285,.345,.41,.48,.56,.65,.75];
  ticks.forEach((t,i)=>{
   const p=i/(ticks.length-1);
   drawSfxTone(ctx,1050-p*420,t,.035+.018*p,.035+.018*p,'square',760-p*260)
  });
  drawSfxTone(ctx,190,.72,.18,.07,'sine',310);
  return
 }
 if(kind==='open'){
  drawSfxNoise(ctx,0,.18,.08);
  drawSfxTone(ctx,160,0,.20,.075,'sawtooth',560);
  drawSfxTone(ctx,720,.075,.20,.045,'triangle',1120);
  return
 }
 if(kind==='drag'){
  /* 卡牌飛向十連格子的拖曳 / 呼嘯聲 */
  drawSfxNoise(ctx,0,.48,.052);
  drawSfxTone(ctx,760,0,.46,.032,'sine',210);
  drawSfxTone(ctx,1320,.03,.36,.018,'triangle',520);
  return
 }
 if(kind==='slot'){
  drawSfxTone(ctx,610,0,.065,.04,'triangle',780);
  drawSfxTone(ctx,880,.035,.075,.022,'sine',1040);
  return
 }
 if(kind==='button'){
  drawSfxTone(ctx,540,0,.055,.028,'triangle',690);
  drawSfxTone(ctx,820,.035,.05,.018,'sine',940);
  return
 }
 if(kind==='quick'){
  drawSfxTone(ctx,330,0,.09,.06,'triangle',510);
  drawSfxTone(ctx,660,.065,.10,.04,'sine',880);
  return
 }
 if(kind==='complete'){
  drawSfxTone(ctx,392,0,.15,.05,'triangle',523);
  drawSfxTone(ctx,523,.08,.18,.045,'triangle',784);
  return
 }
 if(kind==='reveal'){
  if(r==='UR'){
   drawSfxNoise(ctx,0,.34,.115);
   drawSfxTone(ctx,205,0,.34,.13,'sine',92);
   [880,1320,1760,2093].forEach((f,i)=>drawSfxTone(ctx,f,.03*i,.48,.075-i*.008,'sine',f*1.1));
   drawSfxTone(ctx,523,.11,.50,.065,'triangle',1568);
   return
  }
  if(r==='SSR'){
   /* SSR：低頻衝擊 + 三層高亮和弦 + 尾音 */
   drawSfxNoise(ctx,0,.20,.075);
   drawSfxTone(ctx,150,0,.30,.135,'sine',72);
   [523,784,1046,1568].forEach((f,i)=>drawSfxTone(ctx,f,.035*i,.36,.072-i*.006,'triangle',f*1.06));
   drawSfxTone(ctx,2093,.16,.30,.04,'sine',2349);
   return
  }
  if(r==='SR'){
   /* SR：比一般卡更明亮、雙段提示 */
   drawSfxTone(ctx,392,0,.18,.075,'triangle',660);
   drawSfxTone(ctx,784,.045,.24,.060,'sine',1175);
   drawSfxTone(ctx,1318,.12,.20,.038,'triangle',1568);
   return
  }
  if(r==='R'){
   drawSfxTone(ctx,430,0,.11,.048,'triangle',570);
   return
  }
  drawSfxTone(ctx,330,0,.09,.035,'sine',410)
 }
}

function renderGiftPage(gifts=[],message=''){

 <div class="giftSectionTitle"><span>尚未領取的代碼</span><span>${active.length}</span></div>
 <div class="giftCodeList">${active.length?active.map(g=>{const {kind,c}=giftCardMeta(g),label=kind==='cheer'?'應援':(g.rarity||c?.rarity||'');return `<div class="giftCodeRow">${(g.image_url||c?.image)?`<img src="${esc(g.image_url||c.image)}" onerror="this.style.display='none'">`:''}<div class="giftCodeInfo"><b>${esc(label)}｜${esc(g.card_name||c?.name||(kind==='cheer'?'未知應援卡':'未知球員'))}${kind==='cheer'?'<span class="giftTypeBadge">應援團卡</span>':''}</b><div class="giftCodeValue">${esc(g.gift_code||'')}</div><small>剩餘 <span class="giftCountdown" data-expires="${esc(g.expires_at||'')}">${giftTimeLeft(g.expires_at)}</span>｜未領取到期自動退回</small><div class="giftCodeActions"><button class="small giftCopyBtn" data-code="${esc(g.gift_code||'')}">複製代碼</button></div></div><span class="giftStatusBadge active">等待領取</span></div>`}).join(''):'<div class="giftEmpty">目前沒有等待領取的贈送代碼。</div>'}</div>
 <div class="giftSectionTitle"><span>可贈送的多餘卡片</span><span>${extras.length} 種</span></div>
 <div class="giftCardList">${extras.length?extras.map(c=>`<div class="giftCardRow">${c.image?`<img src="${esc(c.image)}" onerror="this.style.display='none'">`:''}<div class="giftCardInfo"><b>${esc(c.rarity)}｜${esc(c.name||'未命名卡片')}${c.cardKind==='cheer'?'<span class="giftTypeBadge">應援團卡</span>':''}</b><small>${esc(c.cardKind==='cheer'?'應援團卡':(c.team||'未設定球隊'))}</small></div><div class="giftCardCount">×${countOfCard(c.id)}</div><button class="small giftMakeBtn" data-gift-card="${esc(c.id)}" data-gift-kind="${esc(c.cardKind)}">產生代碼</button></div>`).join(''):'<div class="giftEmpty">目前沒有可贈送的重複卡片。<br>每張卡至少會保留 1 張。</div>'}</div>`;
 $('giftClaimBtn').onclick=async()=>{const code=$('giftClaimCode').value.trim();if(!code){$('giftResult').textContent='請輸入贈送代碼';return}const btn=$('giftClaimBtn');btn.disabled=true;$('giftResult').textContent='領取中…';try{await syncProgressBeforeGift();const data=await giftApi('claim_gift',{code});if(data?.progress)applyPlayerProgress(data.progress);const name=data?.card?.name||(data?.card_kind==='cheer'?'應援團卡':'球員卡');await openGiftPage('✅ 已領取：'+name)}catch(e){$('giftResult').textContent='❌ '+(e.message||e);btn.disabled=false}};
 document.querySelectorAll('[data-gift-card]').forEach(btn=>btn.onclick=async()=>{const cardId=btn.dataset.giftCard,cardKind=btn.dataset.giftKind==='cheer'?'cheer':'player',c=cardKind==='cheer'?CHEER_CARDS.find(x=>x.id===cardId):CARDS.find(x=>x.id===cardId);if(!c)return;if(!confirm(`確定將「${c.name||'此卡片'}」轉成贈送代碼嗎？\n建立後會先扣除 1 張，30 分鐘沒人領取會退回。`))return;btn.disabled=true;try{await syncProgressBeforeGift();const data=await giftApi('create_gift',{cardId,cardKind});if(data?.progress)applyPlayerProgress(data.progress);const code=data?.gift?.gift_code||'';await openGiftPage(code?'✅ 已建立代碼：'+code:'✅ 贈送代碼已建立')}catch(e){alert(e.message||e);btn.disabled=false}});

async function localMessageApi(action,payload={}){
 const accountId=String(PLAYER?.id||'');if(!accountId)throw new Error('請先登入');
 let accounts=safeJSON('cp_local_accounts',[]);if(!Array.isArray(accounts))accounts=[];
 let messages=safeJSON('cp_local_private_messages',[]);if(!Array.isArray(messages))messages=[];
 const me=accounts.find(a=>String(a.id)===accountId),friendMap=new Map(accounts.map(a=>[String(a.id),a]));
 const social=await localPlayerApi('list_social').catch(()=>({friends:[]}));const friends=Array.isArray(social.friends)?social.friends:[];
 const friendIds=new Set(friends.map(f=>String(f.id)));
 const convRows=()=>friends.map(f=>{const rows=messages.filter(m=>(String(m.sender_id)===accountId&&String(m.recipient_id)===String(f.id))||(String(m.sender_id)===String(f.id)&&String(m.recipient_id)===accountId)).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));const unread=rows.filter(m=>String(m.recipient_id)===accountId&&!m.read_at).length;return{friend_id:f.id,game_name:f.game_name,online:!!f.online,last_seen_at:f.last_seen_at||null,unread,last_message:rows[0]||null}}).sort((a,b)=>new Date(b.last_message?.created_at||0)-new Date(a.last_message?.created_at||0));
 if(action==='list_conversations'||action==='unread_count'){const rows=convRows();return{conversations:rows,unread_total:rows.reduce((s,x)=>s+Number(x.unread||0),0)}}
 const friendId=String(payload.friendId||'');if(!friendIds.has(friendId))throw new Error('只能和好友私訊');
 if(action==='list_messages'){const now=new Date().toISOString();messages.forEach(m=>{if(String(m.sender_id)===friendId&&String(m.recipient_id)===accountId&&!m.read_at)m.read_at=now});storage.setItem('cp_local_private_messages',JSON.stringify(messages));const rows=messages.filter(m=>(String(m.sender_id)===accountId&&String(m.recipient_id)===friendId)||(String(m.sender_id)===friendId&&String(m.recipient_id)===accountId)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)).slice(-120);const f=friends.find(x=>String(x.id)===friendId)||{id:friendId,game_name:friendMap.get(friendId)?.gameName||'好友'};const c=convRows();return{friend:f,messages:rows,conversations:c,unread_total:c.reduce((s,x)=>s+Number(x.unread||0),0)}}
 if(action==='mark_read'){const now=new Date().toISOString();messages.forEach(m=>{if(String(m.sender_id)===friendId&&String(m.recipient_id)===accountId&&!m.read_at)m.read_at=now});storage.setItem('cp_local_private_messages',JSON.stringify(messages));const c=convRows();return{ok:true,conversations:c,unread_total:c.reduce((s,x)=>s+Number(x.unread||0),0)}}
 if(action==='send_message'){const message=String(payload.message||'').trim().slice(0,200);if(!message)throw new Error('請輸入訊息');const row={id:'local_dm_'+uid(),sender_id:accountId,recipient_id:friendId,message,created_at:new Date().toISOString(),read_at:null};messages.push(row);storage.setItem('cp_local_private_messages',JSON.stringify(messages));const c=convRows();return{ok:true,message:row,conversations:c,unread_total:c.reduce((s,x)=>s+Number(x.unread||0),0)}}
 throw new Error('未知私訊操作')
}
async function messageApi(action,payload={}){if(IS_LOCAL_TEST)return localMessageApi(action,payload);const headers={'Content-Type':'application/json'};if(PLAYER_TOKEN)headers['x-player-token']=PLAYER_TOKEN;let res;try{res=await fetch(MESSAGE_API,{method:'POST',headers,body:JSON.stringify({action,...payload})})}catch(e){const err=new Error('私訊連線失敗');err.network=true;throw err}let data={};try{data=await res.json()}catch(_e){}if(!res.ok){const err=new Error(data.error||('私訊 API 錯誤 '+res.status));err.status=res.status;throw err}return data}

  const poolId=currentPool()?.id||'';

function blobToDataURL(blob){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||''));r.onerror=()=>reject(new Error('圖片轉換失敗'));r.readAsDataURL(blob)})}
function openImageCropper(file){
 return new Promise((resolve,reject)=>{
  if(!file||!file.type.startsWith('image/')){reject(new Error('請選擇圖片檔案'));return}
  const reader=new FileReader();
  reader.onerror=()=>reject(new Error('圖片讀取失敗'));
  reader.onload=()=>{
   const img=new Image();
   img.onerror=()=>reject(new Error('圖片讀取失敗'));
   img.onload=()=>{
    const box=document.createElement('div');box.className='imageCropBackdrop';
    box.innerHTML=`<div class="imageCropModal"><div class="modalHead"><div><h3 style="margin:0">🖼️ 調整卡牌圖片</h3><div class="sub">拖曳圖片位置，滑桿調整大小</div></div><button class="small" id="cropCancelTop">✕</button></div><div id="cropCanvasWrap" class="imageCropCanvasWrap"><canvas id="cropCanvas" class="imageCropCanvas" width="300" height="400"></canvas></div><div class="imageCropHint">用滑鼠或手指拖曳上下左右</div><div class="imageCropControls"><label>圖片大小 <span id="cropZoomText">100%</span><input id="cropZoom" type="range" min="1" max="4" value="1" step="0.01"></label></div><div class="imageCropActions"><button id="cropReset" class="small">↺ 重設</button><button id="cropConfirm" class="admin">✓ 使用這個裁切</button></div></div>`;
    appOverlayRoot().appendChild(box);
    const canvas=box.querySelector('#cropCanvas'),wrap=box.querySelector('#cropCanvasWrap'),ctx=canvas.getContext('2d');
    const zoomEl=box.querySelector('#cropZoom'),zoomText=box.querySelector('#cropZoomText');
    let zoom=1,ox=0,oy=0,dragging=false,lastX=0,lastY=0,settled=false;
    const baseScale=()=>Math.max(canvas.width/img.naturalWidth,canvas.height/img.naturalHeight);
    function clamp(){const sc=baseScale()*zoom,sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;const mx=Math.max(0,(sw-canvas.width)/2),my=Math.max(0,(sh-canvas.height)/2);ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy))}
    function draw(){clamp();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#080913';ctx.fillRect(0,0,canvas.width,canvas.height);const sc=baseScale()*zoom,sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;ctx.drawImage(img,(canvas.width-sw)/2+ox,(canvas.height-sh)/2+oy,sw,sh)}
    function close(result){if(settled)return;settled=true;box.remove();resolve(result)}
    function reset(){zoom=1;ox=0;oy=0;zoomEl.value='1';zoomText.textContent='100%';draw()}
    zoomEl.oninput=()=>{zoom=Number(zoomEl.value)||1;zoomText.textContent=Math.round(zoom*100)+'%';draw()};
    wrap.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;wrap.classList.add('dragging');wrap.setPointerCapture?.(e.pointerId);e.preventDefault()});
    wrap.addEventListener('pointermove',e=>{if(!dragging)return;const rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width,sy=canvas.height/rect.height;ox+=(e.clientX-lastX)*sx;oy+=(e.clientY-lastY)*sy;lastX=e.clientX;lastY=e.clientY;draw();e.preventDefault()});
    const endDrag=e=>{dragging=false;wrap.classList.remove('dragging');try{wrap.releasePointerCapture?.(e.pointerId)}catch(_){}};
    wrap.addEventListener('pointerup',endDrag);wrap.addEventListener('pointercancel',endDrag);
    box.querySelector('#cropReset').onclick=reset;
    box.querySelector('#cropCancelTop').onclick=()=>close(null);
    box.addEventListener('click',e=>{if(e.target===box)close(null)});
    box.querySelector('#cropConfirm').onclick=()=>{
     clamp();const out=document.createElement('canvas');out.width=900;out.height=1200;const octx=out.getContext('2d');const factor=out.width/canvas.width;const sc=Math.max(out.width/img.naturalWidth,out.height/img.naturalHeight)*zoom;const sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;octx.drawImage(img,(out.width-sw)/2+ox*factor,(out.height-sh)/2+oy*factor,sw,sh);out.toBlob(blob=>{if(!blob){reject(new Error('圖片裁切失敗'));box.remove();return}close(blob)},'image/webp',.88)
    };
    draw();
   };
   img.src=String(reader.result||'');
  };
  reader.readAsDataURL(file)
 })
}

function bindCardPositionRule(key){
 const el=$('position_'+key),hint=$('positionCoeff_'+key);if(!el)return;
 const apply=()=>{el.value=normalizeCardPosition(el.value);if(hint)hint.textContent=positionCoefficientText(el.value)};
 el.onchange=apply;apply()
}
function bindCardPowerRange(key){
 const rarityEl=$('rarity_'+key),powerEl=$('power_'+key),hint=$('powerRange_'+key);
 if(!rarityEl||!powerEl)return;
 const apply=()=>{
  const rarity=rarityEl.value,range=cardPowerRange(rarity);
  if(range){
   powerEl.min=String(range.min);powerEl.max=String(range.max);powerEl.step='1';
   const n=Math.floor(Number(powerEl.value));
   if(!Number.isFinite(n)||n<range.min||n>range.max)powerEl.value=String(range.min);
   if(hint)hint.textContent='允許 '+range.min+'-'+range.max;
  }else{
   powerEl.removeAttribute('min');powerEl.removeAttribute('max');powerEl.step='1';
   if(hint)hint.textContent='未限制'
  }
 };
 rarityEl.onchange=apply;apply()
}
async function saveCard(i){
 if(!CARDS[i])return;
 const key=String(i),notice=$('adminNotice_'+key)||$('adminNotice'),oldRarity=CARDS[i].rarity;
 const poolId=document.querySelector('input[name="cardPoolPick_'+key+'"]:checked')?.value||'';
 if(!poolId){if(notice)notice.textContent='❌ 請選擇 1 個所屬卡池';return}
 const name=$('name_'+key)?.value.trim()||'';if(!name){if(notice)notice.textContent='❌ 請輸入球員名字';return}
 const rarity=$('rarity_'+key)?.value||'N',powerCheck=validateCardPower(rarity,$('power_'+key)?.value);
 if(!powerCheck.ok){if(notice)notice.textContent='❌ '+powerCheck.message;return}
 const oldId=CARDS[i].id;
 try{
  if(notice)notice.textContent='儲存中…';
  const uploadedImage=await getUploadedImageData(i);
  const card={...CARDS[i],name,type:$('type_'+key)?.value.trim()||'',position:normalizeCardPosition($('position_'+key)?.value),team:$('team_'+key)?.value.trim()||'',rarity,power:powerCheck.value,image:uploadedImage||CARDS[i].image||'',description:$('description_'+key)?.value||''};
  await cloudSaveCard(card,i,poolId);
  CARDS[i]=card;
  ADMIN_POOLS=ADMIN_POOLS.map(p=>{const ids=new Set(p.cardIds||[]);if(p.id===poolId)ids.add(card.id);else ids.delete(card.id);return{...p,cardIds:[...ids]}});
  syncVisiblePoolsFromAdmin();await cardDB.set(CARDS);save();

  /* 搜尋模式儲存後重新套用跨稀有度搜尋條件。 */
  if(ADMIN_CARD_SEARCH_QUERY){
   clearPendingCardImage(i);
   await showCardManager(card.rarity,oldId,'✅ 已儲存，可繼續搜尋與左右滑動',ADMIN_CARD_SEARCH_QUERY);
   return
  }

  /* 稀有度沒變時不重畫管理頁，真正停留在同一張卡、同一滑動位置。 */
  if(card.rarity===oldRarity){
   const slide=document.querySelector(`.adminCardEditorSlide[data-card-id="${CSS.escape(oldId)}"]`);
   const title=slide?.querySelector('.adminCardSlideTitle');if(title)title.textContent=card.rarity+'｜'+(card.name||'未命名球員');
   const hero=$('adminEditorPreview_'+key);
   if(hero&&uploadedImage)hero.innerHTML=`<img src="${esc(card.image)}" onerror="this.style.display='none'">`;
   clearPendingCardImage(i);
   if(notice)notice.textContent='✅ 已儲存，可直接繼續左右滑動';
   return
  }

  /* 若修改了稀有度，該卡會移到新的分類，因此切到新分類並定位同一張卡。 */
  clearPendingCardImage(i);
  await showCardManager(card.rarity,oldId,'✅ 已儲存，卡牌已移到 '+card.rarity+' 分類','')
 }catch(e){if(notice)notice.textContent='❌ '+(e.message||e)}
}

 }else{if(prev)prev.disabled=true;if(next)next.disabled=true}
}

function showBondManager(editIndex=null){const modal=$('modal');if(Number.isInteger(editIndex)&&BONDS[editIndex]){const b=BONDS[editIndex];modal.innerHTML=`<div class="modalBackdrop"><div class="modal"><div class="modalHead"><div><h2>🔗 編輯羈絆</h2><div class="sub">選擇會觸發羈絆的球員卡</div></div><button class="small" id="backBondList">← 返回</button></div>${bondFormHtml(b)}<div class="adminToolbar"><button id="saveBond" class="admin">💾 儲存羈絆</button><button id="deleteBond" class="small">🗑️ 刪除羈絆</button></div><div id="bondNotice" class="notice"></div></div></div>`;$('backBondList').onclick=()=>showBondManager();$('saveBond').onclick=()=>saveBondFromForm(editIndex);bindBondBonusUI();$('deleteBond').onclick=async()=>{if(!confirm('確定刪除這組羈絆嗎？'))return;const id=BONDS[editIndex].id;try{await cloudDeleteBond(id);BONDS.splice(editIndex,1);save();showBondManager()}catch(e){$('bondNotice').textContent='❌ '+(e.message||e)}};return}modal.innerHTML=`<div class="modalBackdrop"><div class="modal"><div class="modalHead"><div><h2>🔗 羈絆管理</h2><div class="sub">共 ${BONDS.length} 組羈絆</div></div><button class="small" id="backAdmin">← 後台</button></div><div class="adminToolbar"><button id="addBond" class="admin">➕ 新增羈絆</button></div><div class="bondList">${BONDS.length?BONDS.map((b,i)=>bondItemHtml(b,i)).join(''):'<div class="notice">目前還沒有羈絆。</div>'}</div></div></div>`;$('backAdmin').onclick=showAdmin;$('addBond').onclick=()=>showBondEditorNew();document.querySelectorAll('.editBond').forEach(b=>b.onclick=()=>showBondManager(Number(b.dataset.i)))}
function normalizeBondBonus(b={}){if(b.bonusType==='multiplier')return{bonusType:'multiplier',bonusValue:Number(b.bonusValue)||1};if(b.bonusType==='value')return{bonusType:'value',bonusValue:Number(b.bonusValue)||0};if(Number.isFinite(Number(b.powerBonus)))return{bonusType:'value',bonusValue:Number(b.powerBonus)||0};return{bonusType:'value',bonusValue:0}}

function bondFormHtml(b={}){const bonus=normalizeBondBonus(b);const battleUseLimit=Number.isFinite(Number(b.battleUseLimit))&&Number(b.battleUseLimit)>0?Math.floor(Number(b.battleUseLimit)):1;return `<div class="bondForm"><label>羈絆名稱<input id="bondName" value="${esc(b.name||'')}"></label><div class="bondBonusRow"><label>加成方式<select id="bondBonusType"><option value="value" ${bonus.bonusType==='value'?'selected':''}>數值加成</option><option value="multiplier" ${bonus.bonusType==='multiplier'?'selected':''}>倍數加成</option></select></label><label><span id="bondBonusLabel">${bonus.bonusType==='multiplier'?'倍數':'加成數值'}</span><input id="bondBonusValue" type="number" step="${bonus.bonusType==='multiplier'?'0.01':'1'}" min="0" value="${bonus.bonusType==='multiplier'?Number(bonus.bonusValue).toFixed(2):Number(bonus.bonusValue)}"></label></div><div id="bondBonusHint" class="bondBonusHint">${bonus.bonusType==='multiplier'?'例如 1.10 = 戰力 ×1.10':'例如 500 = 戰力 +500'}</div><div class="bondLimitRow"><label>單場可觸發次數<input id="bondBattleUseLimit" type="number" min="1" step="1" value="${battleUseLimit}"></label><div class="bondBonusHint">例如 3 = 每場比賽最多觸發 3 次</div></div><label>說明<textarea id="bondDescription">${esc(b.description||'')}</textarea></label><div><b style="font-size:12px">選擇球員卡</b><div class="bondPlayerPicker">${bondCardPickerHtml(b.cardIds||[])}</div></div></div>`}
function bindBondBonusUI(){const type=$('bondBonusType'),label=$('bondBonusLabel'),input=$('bondBonusValue'),hint=$('bondBonusHint');if(!type||!label||!input||!hint)return;const update=()=>{const mul=type.value==='multiplier';label.textContent=mul?'倍數':'加成數值';input.step=mul?'0.01':'1';if(mul&&Number(input.value)===0)input.value='1.00';hint.textContent=mul?'例如 1.10 = 戰力 ×1.10':'例如 500 = 戰力 +500'};type.onchange=update;update()}

async function saveBondFromForm(editIndex=null){const name=$('bondName').value.trim();const cardIds=[...document.querySelectorAll('.bondCardCheck:checked')].map(x=>x.value);const bonusType=$('bondBonusType').value==='multiplier'?'multiplier':'value';let bonusValue=Number($('bondBonusValue').value);let battleUseLimit=Number($('bondBattleUseLimit').value);const description=$('bondDescription').value.trim();if(!name){$('bondNotice').textContent='❌ 請輸入羈絆名稱';return}if(cardIds.length<2){$('bondNotice').textContent='❌ 羈絆至少需要 2 張球員卡';return}if(!Number.isFinite(bonusValue)||bonusValue<0){$('bondNotice').textContent='❌ 請輸入正確的加成數值';return}if(bonusType==='multiplier'&&bonusValue<=0){$('bondNotice').textContent='❌ 倍數必須大於 0';return}if(!Number.isFinite(battleUseLimit)||battleUseLimit<1){$('bondNotice').textContent='❌ 單場觸發次數至少要 1 次';return}battleUseLimit=Math.floor(battleUseLimit);if(bonusType==='value')bonusValue=Math.round(bonusValue);const data={id:Number.isInteger(editIndex)&&BONDS[editIndex]?BONDS[editIndex].id:uid(),name,cardIds,bonusType,bonusValue,battleUseLimit,description};try{await cloudSaveBond(data);if(Number.isInteger(editIndex)&&BONDS[editIndex])BONDS[editIndex]=data;else BONDS.push(data);save();showBondManager()}catch(e){$('bondNotice').textContent='❌ '+(e.message||e)}}

function drawSfxTone(ctx,freq,start=0,dur=.12,vol=.1,type='sine',endFreq=0){
 try{
  const t=ctx.currentTime+Math.max(0,start),o=ctx.createOscillator(),g=ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(Math.max(30,freq),t);
  if(endFreq>0)o.frequency.exponentialRampToValueAtTime(Math.max(30,endFreq),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+.03)
 }catch(_e){}
}
function drawSfxNoise(ctx,start=0,dur=.1,vol=.05){
 try{
  const sr=ctx.sampleRate,len=Math.max(1,Math.floor(sr*dur)),buf=ctx.createBuffer(1,len,sr),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,1.7);
  const s=ctx.createBufferSource(),g=ctx.createGain(),t=ctx.currentTime+Math.max(0,start);s.buffer=buf;
  g.gain.setValueAtTime(Math.max(.0002,vol),t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(g);g.connect(ctx.destination);s.start(t);s.stop(t+dur+.02)
 }catch(_e){}
}

function openImageCropper(file){

    const box=document.createElement('div');box.className='imageCropBackdrop';

    appOverlayRoot().appendChild(box);
    const canvas=box.querySelector('#cropCanvas'),wrap=box.querySelector('#cropCanvasWrap'),ctx=canvas.getContext('2d');
    const zoomEl=box.querySelector('#cropZoom'),zoomText=box.querySelector('#cropZoomText');
    let zoom=1,ox=0,oy=0,dragging=false,lastX=0,lastY=0,settled=false;
    const baseScale=()=>Math.max(canvas.width/img.naturalWidth,canvas.height/img.naturalHeight);
    function clamp(){const sc=baseScale()*zoom,sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;const mx=Math.max(0,(sw-canvas.width)/2),my=Math.max(0,(sh-canvas.height)/2);ox=Math.max(-mx,Math.min(mx,ox));oy=Math.max(-my,Math.min(my,oy))}

    function close(result){if(settled)return;settled=true;box.remove();resolve(result)}
    function reset(){zoom=1;ox=0;oy=0;zoomEl.value='1';zoomText.textContent='100%';draw()}
    zoomEl.oninput=()=>{zoom=Number(zoomEl.value)||1;zoomText.textContent=Math.round(zoom*100)+'%';draw()};
    wrap.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;wrap.classList.add('dragging');wrap.setPointerCapture?.(e.pointerId);e.preventDefault()});

    box.querySelector('#cropReset').onclick=reset;
    box.querySelector('#cropCancelTop').onclick=()=>close(null);
    box.addEventListener('click',e=>{if(e.target===box)close(null)});
    box.querySelector('#cropConfirm').onclick=()=>{
     clamp();const out=document.createElement('canvas');out.width=900;out.height=900;const octx=out.getContext('2d');const factor=out.width/canvas.width;const sc=Math.max(out.width/img.naturalWidth,out.height/img.naturalHeight)*zoom;const sw=img.naturalWidth*sc,sh=img.naturalHeight*sc;octx.drawImage(img,(out.width-sw)/2+ox*factor,(out.height-sh)/2+oy*factor,sw,sh);out.toBlob(blob=>{if(!blob){reject(new Error('圖片裁切失敗'));box.remove();return}close(blob)},'image/webp',.88)

  };

function bindCardPowerRange(key){

async function v207LocalEconomyApi(action,payload={}){

 const mail={id:'local_starter_v207',mail_key:'starter_gift_v207',title:'新手大禮包',body:'歡迎加入遊戲！為你準備了新手大禮包，領取後即可開始組建你的球隊。',attachments:[{kind:'card',card_id:V207_SP_CARD_ID,label:'SP｜傳奇終結者',amount:1},{kind:'gems',label:'鑽石',amount:5000},{kind:'ssr_ticket',label:'SSR 必中券',amount:1}],created_at:new Date().toISOString(),claimed_at:claimed?new Date().toISOString():null};
 if(action==='mailbox_status')return{unclaimed_count:claimed?0:1,gems,ssr_tickets:V207_SSR_TICKETS};
 if(action==='list_mail')return{mails:[mail],unclaimed_count:claimed?0:1,progress:currentProgressPayload()};

  return{ok:true,claimed:claimed?0:1,progress:currentProgressPayload(),mails:[{...mail,claimed_at:new Date().toISOString()}],unclaimed_count:0}
 }
 if(action==='spend_gems'){const count=Number(payload.count)===10?10:1,cost=count===10?900:100;if(gems<cost)throw new Error('鑽石不夠！');gems-=cost;save();return{ok:true,cost,gems}}
 if(action==='use_ssr_ticket'){
  if(V207_SSR_TICKETS<=0)throw new Error('沒有 SSR 必中券');
  const pool=CARDS.filter(c=>String(c.rarity).toUpperCase()==='SSR'&&!owned.includes(c.id));

 }
 throw new Error('不支援的資產操作')
}

 try{const d=await urApi('super_player_detail',{playerId}),p=d.player||{},body=tab==='basic'?v215SuperBasicHtml(d):tab==='cards'?v215SuperCardsHtml(d):tab==='lineup'?v215SuperLineupHtml(d):tab==='activity'?v215SuperActivityHtml(d):tab==='social'?v215SuperSocialHtml(d):`<pre class="v215JsonBox">${esc(v215Pretty(d))}</pre>`;modal.innerHTML=`<div class="modalBackdrop"><div class="modal v215SuperModal"><div class="modalHead"><div><h2 style="margin:0">${esc(p.game_name||'玩家')}</h2><div class="sub">${p.is_bot?'BOT':p.ai_takeover?'真人｜AI 接管中':'真人'}｜ID ${esc(p.id||playerId)}</div></div><button class="small" id="v215SGBack">← 玩家列表</button></div><div class="v215SuperTabs">${v215SuperTabButton(tab,'basic','基本／排位')}${v215SuperTabButton(tab,'cards','卡片')}${v215SuperTabButton(tab,'lineup','牌組／AI')}${v215SuperTabButton(tab,'activity','關卡／信箱')}${v215SuperTabButton(tab,'social','社交／戰績')}${v215SuperTabButton(tab,'raw','完整資料')}</div>${body}</div></div>`;
 $('v215SGBack').onclick=()=>showV215SuperPlayers(back.page||1,back.search||'');document.querySelectorAll('[data-v215-super-tab]').forEach(b=>b.onclick=()=>showV215SuperPlayerDetail(playerId,b.dataset.v215SuperTab,back));
 if(tab==='basic'){
  $('v215SGSaveBasic').onclick=async()=>{const n=$('v215SGNotice');n.textContent='儲存中…';try{await urApi('super_update_player',{playerId,patch:{profile:{game_name:$('v215SGName').value.trim(),banned:$('v215SGBanned').checked,ban_reason:$('v215SGBanReason').value.trim()},progress:{gems:Number($('v215SGGems').value)||0,ssr_tickets:Number($('v215SGTickets').value)||0},competitive:{player_level:Number($('v215SGLevel').value)||1,rating:Number($('v215SGRating').value)||0,wins:Number($('v215SGWins').value)||0,losses:Number($('v215SGLosses').value)||0,win_streak:Number($('v215SGStreak').value)||0,highest_rating:Number($('v215SGHighest').value)||0}}});await showV215SuperPlayerDetail(playerId,'basic',back)}catch(e){n.textContent='❌ '+(e.message||e)}};
  $('v215SGResetPassword').onclick=async()=>{const n=$('v215SGNotice'),pwd=$('v215SGPassword').value;n.textContent='重設中…';try{await urApi('super_reset_password',{playerId,newPassword:pwd});$('v215SGPassword').value='';n.textContent='✅ 密碼已重設，原登入裝置已強制登出'}catch(e){n.textContent='❌ '+(e.message||e)}}
 }
 if(tab==='cards'){document.querySelectorAll('[data-v215-save-card]').forEach(b=>b.onclick=async()=>{const id=b.dataset.v215SaveCard,kind=b.dataset.kind,n=$('v215SGNotice'),count=document.querySelector(`[data-v215-count="${CSS.escape(id)}"]`),level=document.querySelector(`[data-v215-level="${CSS.escape(id)}"]`);n.textContent='更新中…';try{await urApi('super_set_card_count',{playerId,cardId:id,kind,count:Number(count?.value)||0,level:Number(level?.value)||1});await showV215SuperPlayerDetail(playerId,'cards',back)}catch(e){n.textContent='❌ '+(e.message||e)}});const add=$('v215SGManualCardSave');if(add)add.onclick=async()=>{const n=$('v215SGNotice');n.textContent='更新指定卡片中…';try{await urApi('super_set_card_count',{playerId,cardId:$('v215SGManualCardId').value.trim(),kind:$('v215SGManualKind').value,count:Number($('v215SGManualCount').value)||0,level:Number($('v215SGManualLevel').value)||1});await showV215SuperPlayerDetail(playerId,'cards',back)}catch(e){n.textContent='❌ '+(e.message||e)}}}
 if(tab==='lineup')$('v215SGSaveLineup').onclick=async()=>{const n=$('v215SGNotice');n.textContent='儲存中…';try{await urApi('super_update_player',{playerId,patch:{lineup:{decks:v215ParseJson('v215SGDecks','牌組'),active_deck:Number($('v215SGActiveDeck').value)||1,defense_deck:Number($('v215SGDefenseDeck').value)||1},ai_profile:{batting:v215ParseJson('v215SGBatting','batting'),pitching:v215ParseJson('v215SGPitching','pitching'),pitcher_usage:v215ParseJson('v215SGPitcherUsage','pitcher_usage'),substitutions:v215ParseJson('v215SGSubs','substitutions')}}});await showV215SuperPlayerDetail(playerId,'lineup',back)}catch(e){n.textContent='❌ '+(e.message||e)}};
 if(tab==='activity'){document.querySelectorAll('[data-v215-mail]').forEach(b=>b.onclick=async()=>{const n=$('v215SGNotice');n.textContent='處理中…';try{await urApi('super_mail_action',{playerId,mailId:b.dataset.v215Mail,mailAction:b.dataset.act});await showV215SuperPlayerDetail(playerId,'activity',back)}catch(e){n.textContent='❌ '+(e.message||e)}});const saveStages=$('v215SGSaveStages');if(saveStages)saveStages.onclick=async()=>{const n=$('v215SGNotice');n.textContent='儲存關卡中…';try{const rows=JSON.parse($('v215SGStageProgress').value||'[]');if(!Array.isArray(rows))throw new Error('關卡進度必須是陣列');await urApi('super_update_player',{playerId,patch:{stage_progress:rows,replace_stage_progress:true}});await showV215SuperPlayerDetail(playerId,'activity',back)}catch(e){n.textContent='❌ '+(e.message||e)}}}
 if(tab==='social'){document.querySelectorAll('[data-v215-remove-friend]').forEach(b=>b.onclick=async()=>{const n=$('v215SGNotice');n.textContent='處理中…';try{await urApi('super_set_friendship',{playerId,friendId:b.dataset.v215RemoveFriend,enabled:false});await showV215SuperPlayerDetail(playerId,'social',back)}catch(e){n.textContent='❌ '+(e.message||e)}});const addFriend=$('v215SGAddFriend');if(addFriend)addFriend.onclick=async()=>{const n=$('v215SGNotice');n.textContent='建立好友中…';try{await urApi('super_set_friendship',{playerId,friendId:$('v215SGFriendId').value.trim(),enabled:true});await showV215SuperPlayerDetail(playerId,'social',back)}catch(e){n.textContent='❌ '+(e.message||e)}}}

function v215CreateOverlay(id,html){
 v215CloseOverlay(id);
 const el=document.createElement('div');el.id=id;el.className='v215Overlay';el.innerHTML=html;
 el.addEventListener('click',e=>{if(e.target===el)v215CloseOverlay(id)});
 const host=document.getElementById('appViewport')||document.body;host.appendChild(el);return el
}
function v215OpenPlayerFromElement(el,e){
 try{
  if(e){e.preventDefault?.();e.stopPropagation?.();}
  const node=el?.closest?.('[data-v215-player-id],[data-v215-player-name]')||el;
  const playerId=String(node?.dataset?.v215PlayerId||'');
  const gameName=String(node?.dataset?.v215PlayerName||'');
  if(!playerId&&!gameName)return false;
  showV215PublicPlayerProfile({playerId,gameName});
 }catch(err){
  console.error('v2.17 player profile click failed',err);
  try{v215CreateOverlay('v215PlayerProfileOverlay',`<div class="v215Dialog"><div class="notice">❌ 玩家資訊開啟失敗：${esc(err?.message||err)}</div></div>`)}catch(_e){}
 }
 return false
}

function v215AdminCardCatalog(d){

 for(const c of cards.cheer_cards||[])out.set(String(c.id),{...c,kind:'cheer'});
 for(const c of cards.ur_cards||[])out.set(String(c.id),{...c,kind:'ur'});

}

<script id="v218-sandbox-history-script">
(()=>{
'use strict';
const V218_HISTORY_MAX=80;
const V218_FULL_MAX=5;
let V218_SANDBOX_DRAFT=null;
let V218_HISTORY_FILTER='all';
let V218_REPLAY_TIMER=0;

function v218PlayerStorageId(){return String(PLAYER?.id||PLAYER?.game_name||'local').replace(/[^a-zA-Z0-9_-]/g,'_')||'local'}
function v218HistoryKey(){return'cp_v218_battle_history_'+v218PlayerStorageId()}
function v218FullKey(){return'cp_v218_full_replays_'+v218PlayerStorageId()}
function v218Read(key,fallback=[]){try{const x=JSON.parse(storage.getItem(key)||'null');return x??fallback}catch(_e){return fallback}}
function v218Write(key,value){try{storage.setItem(key,JSON.stringify(value));return true}catch(e){console.warn('v2.18 storage full',e);return false}}
function v218Uid(){return'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function v218ModeLabel(mode){return({room:'房間',stage:'關卡',cpu:'電腦',ranked:'排位',sandbox:'測試'})[mode]||String(mode||'對戰')}
function v218ResultLabel(r){return r==='win'?'勝':r==='loss'?'敗':'和'}
function v218HalfText(h){return h==='bottom'?'下':'上'}
function v218ResultText(r){try{return v127ResultText(r)}catch(_e){return String(r||'')}}
function v218LiteCard(c){if(!c)return null;return{id:String(c.source_id||c._v218SourceId||c.id||''),name:String(c.name||''),rarity:String(c.rarity||''),position:String(c.position||''),power:Number(c.power)||0}}
function v218UniqueLite(cards){const out=[],seen=new Set();for(const c of cards||[]){const x=v218LiteCard(c);if(!x||!x.id||seen.has(x.id))continue;seen.add(x.id);out.push(x)}return out}
function v218BasesLite(b){return(Array.isArray(b)?b:[]).map(x=>x?String(x.name||'跑者'):'')}
function v218Toast(msg){if(typeof v215UpgradeToast==='function')v215UpgradeToast(msg);else console.log(msg)}

// --- 逐打席記錄：在既有 PA 紀錄後補上當下完整局面 ---
const V218_ORIG_RECORD_PA=v144RecordPA;
v144RecordPA=function(s,batter,pitcher,result,runs,batStrategy,pitchStrategy){
 V218_ORIG_RECORD_PA(s,batter,pitcher,result,runs,batStrategy,pitchStrategy);
 if(!s)return;const row=s.paLog?.[s.paLog.length-1];if(!row)return;
 Object.assign(row,{player_score:Number(s.playerScore)||0,opponent_score:Number(s.opponentScore)||0,outs:Number(s.outs)||0,balls:Number(s.balls)||0,strikes:Number(s.strikes)||0,bases:v218BasesLite(s.bases),batter_id:String(batter?.source_id||batter?.id||''),pitcher_id:String(pitcher?.source_id||pitcher?.id||''),at:Date.now()});
 s.v218Timeline||(s.v218Timeline=[]);s.v218Timeline.push({...row})
};

function v218BuildRecord(s,result){
 const id=String(s.v218HistoryId||v218Uid());s.v218HistoryId=id;
 return{id,created_at:new Date().toISOString(),mode:String(s.mode||''),mode_label:v218ModeLabel(s.mode),result:String(result||'draw'),player_name:String(s.playerName||PLAYER?.game_name||'玩家'),opponent_name:String(s.opponentName||'對手'),player_score:Number(s.playerScore)||0,opponent_score:Number(s.opponentScore)||0,player_side:String(s.playerSide||'first'),inning:Number(s.inning)||1,stage_id:String(s.stage?.id||s.setup?.stage?.id||''),stage_title:String(s.stage?.title||s.setup?.stage?.title||''),player_lineup:v218UniqueLite([...(s.playerOriginalStarters||[]),...(s.playerCards||[]),...(s.playerBench||[])]),opponent_lineup:v218UniqueLite([...(s.opponentOriginalStarters||[]),...(s.opponentCards||[]),...(s.opponentBench||[])]),plays:(s.paLog||[]).slice(-300).map(x=>({...x})),team_stats:{player:s.teamStats?.player||{},opponent:s.teamStats?.opponent||{}},events:(s.v218Events||[]).slice(-120)}
}
function v218SaveCompletedBattle(s,result){
 if(!s||s.mode==='sandbox'||s._v218HistorySaved)return;s._v218HistorySaved=true;
 const rec=v218BuildRecord(s,result),history=v218Read(v218HistoryKey(),[]).filter(x=>x&&x.id!==rec.id);history.unshift(rec);v218Write(v218HistoryKey(),history.slice(0,V218_HISTORY_MAX));
 const full=v218Read(v218FullKey(),[]).filter(x=>x&&x.id!==rec.id);full.unshift({...rec,full_live:true});v218Write(v218FullKey(),full.slice(0,V218_FULL_MAX))
}
const V218_ORIG_FINISH=v127FinishGame;
v127FinishGame=async function(){const s=V127_BATTLE;if(s?.mode==='sandbox')return;const result=s?.forcedPlayerWin?'win':Number(s?.playerScore)>Number(s?.opponentScore)?'win':Number(s?.playerScore)<Number(s?.opponentScore)?'loss':'draw';const r=await V218_ORIG_FINISH.apply(this,arguments);if(s&&!s.v136SettlementError)v218SaveCompletedBattle(s,result);return r};

// --- 規則 / 我的對戰紀錄 ---

)+' ： '+(p.opponent_score||0)+'</div><div class="state"><div>局數<br><b>'+((p.inning||1)+'局'+half(p.half))+'</b></div><div>出局<br><b>'+(p.outs||0)+'</b></div><div>球數<br><b>B'+(p.balls||0)+' S'+(p.strikes||0)+'</b></div><div>進度<br><b>'+(i+1)+' / '+X.plays.length+'</b></div></div><div class="bases"><i class="'+(b[2]?'on':'')+'"></i><i class="'+(b[1]?'on':'')+'"></i><i class="'+(b[0]?'on':'')+'"></i></div><div class="call">'+(p.batter||'打者')+'｜'+res(p.result)+'<div class="sub">投手 '+(p.pitcher||'')+(p.runs?'｜'+p.runs+' 分打點':'')+'</div></div>';$('prev').disabled=i<=0;$('next').disabled=i>=X.plays.length-1;$('play').textContent=on?'暫停':'自動播放'}function stop(){on=false;clearInterval(t);draw()}$('prev').onclick=()=>{stop();i=Math.max(0,i-1);draw()};$('next').onclick=()=>{stop();i=Math.min(X.plays.length-1,i+1);draw()};$('play').onclick=()=>{if(on){stop();return}on=true;draw();t=setInterval(()=>{if(i>=X.plays.length-1){stop();return}i++;draw()},1350)};draw();<\/script></body></html>`}

  }
  if(t.id==='gameModeRules'){
   stop(e);showV206GameRules('rules');return
  }
  if(t.id==='v218OpenSandbox'){
   stop(e);
   const a=api();if(!a)throw new Error('測試模式尚未載入');
   a.setDraft(a.defaultSandboxDraft());a.openSandbox(false);return
  }
  if(t.id==='v218TestConsole'){
   stop(e);
   const a=api();if(!a)throw new Error('測試控制台尚未載入');
   a.openSandbox(true);return
  }
  if(t.id==='v136BattleExit'){
   stop(e);v136ExitCurrentBattle();return
  }
  if(t.id==='v127CountdownExit'){
   stop(e);await countdownExit(window.V125_MATCH_SETUP);return
  }
  if(t.id==='v218ExitX'||t.id==='v218ExitCancel'){
   stop(e);$('modal').innerHTML='';return
  }
  if(t.id==='v218ExitConfirm'){
   stop(e);
   const a=api();if(!a)throw new Error('退出功能尚未載入');
   await a.confirmExit(window.V127_BATTLE);return
  }
  if(t.id==='v218SbClose'||t.id==='v218SbCancel'){
   stop(e);$('modal').innerHTML='';return
  }
  if(t.matches('[data-v218-pick-side]')){
   stop(e);
   const a=api();if(!a)throw new Error('測試模式尚未載入');
   const d=a.collectSandboxForm();
   const key=t.dataset.v218PickSide==='player'?'playerIds':'cpuIds';
   const id=String(t.dataset.v218CardId||'');
   const arr=d[key]||[],i=arr.indexOf(id);
   if(i>=0){
    if(arr.length<=1){a.toast?.('至少保留 1 名角色');return}
    arr.splice(i,1)
   }else if(arr.length<12)arr.push(id);
   d[key]=arr;a.setDraft(d);a.renderSandbox(inGameSandbox(t));return
  }
  if(t.id==='v218SbRandomCpu'){
   stop(e);
   const a=api();if(!a)throw new Error('測試模式尚未載入');
   const d=a.collectSandboxForm();
   d.cpuIds=a.randomIds(d.cpuRandomCount);
   d.cpuPitcherId=d.cpuIds[0]||'';
   a.setDraft(d);a.renderSandbox(inGameSandbox(t));return
  }
  if(t.id==='v218SbApply'){
   stop(e);
   const a=api();if(!a)throw new Error('測試模式尚未載入');
   const d=a.collectSandboxForm();
   if(!d.playerIds?.length||!d.cpuIds?.length){
    a.toast?.('玩家與電腦至少都要 1 名角色');return
   }
   if(inGameSandbox(t))a.applySandbox(d);
   else a.startSandbox(d);
   return
  }
 }catch(err){
  stop(e);report(err)
 }
},true);
})();
</script>
</body></html>
